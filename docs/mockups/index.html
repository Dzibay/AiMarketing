<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макеты кабинета AiMarketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Каркас макета: полоса с вкладками вариантов и общие сбросы. Стили вариантов лежат в vN.css и действуют только внутри .vN. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: #17181a; font: 13px/1.4 'Inter', system-ui, 'Segoe UI', sans-serif; }
#bar { flex: none; display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; background: #17181a; color: #8d9096; white-space: nowrap; overflow: hidden; }
#bar strong { color: #fff; font-weight: 600; }
#bar nav { display: flex; gap: 2px; }
#bar button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: #c9ccd1; font: inherit; font-weight: 500; cursor: pointer; }
#bar button:hover { background: #2a2c30; color: #fff; }
#bar button.active { background: #fff; color: #17181a; }
#bar span { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
#app { flex: 1; min-height: 0; }
.v { height: 100%; overflow: auto; container-type: inline-size; }
.v button { cursor: pointer; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.v input, .v textarea { font: inherit; color: inherit; }
.v h1, .v h2, .v h3, .v h4, .v p, .v figure { margin: 0; }
.v .ic { flex: none; }
.v .num { font-variant-numeric: tabular-nums; }
.v .spark, .v .bars { display: block; }
.v .chart { display: block; width: 100%; height: auto; }
.v .dots { display: inline-flex; gap: 2px; }
.v .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .5; }
.v .dots i.on { background: currentColor; opacity: 1; }
.v .st { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; white-space: nowrap; }

.gallery {
/* Страница сравнения. Все классы с приставкой g-: внутри лежат миниатюры вариантов, их стили трогать нельзя. */
& {
  --g-bg: #f6f6f4; --g-card: #fff; --g-soft: #ebebe7; --g-line: #e2e2dc;
  --g-ink: #17181a; --g-ink2: #55585e; --g-ink3: #63666d; --g-ok: #1a7f4e;
  background: var(--g-bg); color: var(--g-ink);
  font: 15px/1.55 'Inter', system-ui, 'Segoe UI', sans-serif;
}
&[data-theme='dark'] {
  --g-bg: #111213; --g-card: #1a1b1d; --g-soft: #242528; --g-line: #2d2e31;
  --g-ink: #f0f0ee; --g-ink2: #b3b5ba; --g-ink3: #8b8e94; --g-ok: #5fd08f;
  color-scheme: dark;
}

.g-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 1440px; margin: 0 auto; padding: 40px 32px 80px; }
.g-head { display: grid; gap: 10px; }
.g-eyebrow { color: var(--g-ink3); font-size: 13px; font-weight: 500; }
.g-h1 { font-size: 36px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
.g-lead { max-width: 780px; color: var(--g-ink2); font-size: 17px; }
.g-h2 { font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }

.g-controls { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 12px 0; background: var(--g-bg); }
.g-ctl { display: flex; align-items: center; gap: 10px; color: var(--g-ink2); font-size: 13.5px; }
.g-seg { display: flex; padding: 3px; border-radius: 10px; background: var(--g-soft); }
.g-seg button { height: 30px; padding: 0 12px; border-radius: 7px; color: var(--g-ink2); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.g-seg button:hover { color: var(--g-ink); }
.g-seg button.on { background: var(--g-card); color: var(--g-ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

.g-card { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); align-items: start; gap: 28px; padding: 20px; border: 1px solid var(--g-line); border-radius: 18px; background: var(--g-card); }
.g-thumb { position: relative; aspect-ratio: 1360 / 850; overflow: hidden; border: 1px solid var(--g-line); border-radius: 10px; cursor: pointer; transition: box-shadow .15s; }
.g-thumb:hover { box-shadow: 0 0 0 3px var(--g-soft), 0 10px 30px rgba(0, 0, 0, .12); }
.g-thumb__in { position: absolute; top: 0; left: 0; width: 1360px; height: 850px; transform-origin: 0 0; pointer-events: none; }
.g-thumb__in .v { overflow: hidden; }
.g-thumb__in * { scrollbar-width: none; }
.g-card__text { display: grid; gap: 12px; padding: 4px 4px 4px 0; }
.g-who { color: var(--g-ink3); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.g-name { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.g-idea { color: var(--g-ink2); }
.g-pros, .g-common { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.g-pros li, .g-common li { display: flex; align-items: flex-start; gap: 9px; }
.g-pros .ic, .g-common .ic { margin-top: 4px; color: var(--g-ok); }
.g-risk { padding: 10px 12px; border-radius: 10px; background: var(--g-soft); color: var(--g-ink2); font-size: 14px; }
.g-risk b { color: var(--g-ink); }
.g-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; justify-self: start; height: 40px; padding: 0 16px; border-radius: 10px; background: var(--g-ink); color: var(--g-bg); font-weight: 600; }
.g-btn:hover { opacity: .88; }

.g-sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 20px; }
.g-scroll { overflow-x: auto; border: 1px solid var(--g-line); border-radius: 14px; background: var(--g-card); }
.g-table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; }
.g-table th, .g-table td { padding: 12px 16px; border-top: 1px solid var(--g-line); text-align: left; vertical-align: top; }
.g-table thead th { border-top: 0; font-size: 15px; font-weight: 700; }
.g-table tbody th { width: 17%; color: var(--g-ink2); font-weight: 500; }
.g-table td { width: 27.6%; }
.g-common { max-width: 860px; }
.g-rec { gap: 10px; padding: 22px 24px; border: 1px solid var(--g-line); border-radius: 18px; background: var(--g-card); }
.g-rec p { max-width: 860px; color: var(--g-ink2); }
.g-rec p b { color: var(--g-ink); }

@container (max-width: 1000px) {
  .g-page { padding: 28px 18px 60px; }
  .g-h1 { font-size: 28px; }
  .g-card { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 14px; }
  .g-card__text { padding: 0 4px 6px; }
  .g-name { font-size: 26px; }
}

}

.v1 {
& {
  --bg: #f5f3ee; --surface: #fff; --surface-2: #faf8f3; --ink: #1b1f1c; --ink-2: #555c56; --ink-3: #687068;
  --line: #e8e4da; --accent: #1f6f4a; --accent-ink: #fff; --accent-soft: #e2f0e7;
  --ok: #17704a; --warn: #8f5b00; --bad: #b33424; --ok-soft: #e3f2e9; --warn-soft: #fbefd6; --bad-soft: #fbe5e0;
  --shadow: 0 1px 2px rgba(40, 40, 20, .05), 0 10px 28px rgba(40, 40, 20, .06);
  --r: 18px;
}
&[data-theme='dark'] {
  --bg: #121512; --surface: #1a1e1b; --surface-2: #202521; --ink: #eef1ec; --ink-2: #aab2ab; --ink-3: #8a938b;
  --line: #2b312c; --accent: #74dca4; --accent-ink: #0c1a12; --accent-soft: #1c3226;
  --ok: #62d49b; --warn: #e9b65c; --bad: #f18a77; --ok-soft: #1b3326; --warn-soft: #3a2e15; --bad-soft: #3e221d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25);
}
& { background: var(--bg); color: var(--ink); font: 15px/1.5 'Onest', system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
b, strong { font-weight: 600; }

/* ---- шапка ---- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-style: normal; }
.pop { position: relative; }
.picker { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; white-space: nowrap; }
.menu { position: absolute; top: calc(100% + 8px); left: 0; min-width: 260px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); z-index: 30; }
.menu--right { left: auto; right: 0; }
.menu small { display: block; padding: 10px 10px 4px; color: var(--ink-3); font-size: 12px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; }
.menu button:hover, .menu button.active { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.nav { display: flex; gap: 2px; margin: 0 auto; }
.nav > button, .nav .pop > button { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 999px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.nav > button:hover, .nav .pop > button:hover { color: var(--ink); background: var(--surface); }
.nav > button.active { color: var(--accent-ink); background: var(--accent); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 600; line-height: 20px; text-align: center; }
&[data-theme='dark'] .count { color: #1a0c09; }
.nav > button.active .count { background: var(--accent-ink); color: var(--accent); }
.tools { display: flex; align-items: center; gap: 10px; }
.limit { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.limit__bar { width: 54px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.limit__bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--line); }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.iconbtn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; color: var(--ink-2); }
.iconbtn:hover { background: var(--surface); color: var(--ink); }
.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---- общее ---- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 96px; }
.eyebrow { color: var(--ink-3); font-size: 13px; margin-bottom: 6px; }
h1 { font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -.025em; }
h1 em { font-style: normal; color: var(--bad); }
.lead { margin-top: 8px; color: var(--ink-2); font-size: 16px; }
h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 26px 0 10px; }
h2 span { color: var(--ink-3); font-weight: 500; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); border: 1px solid var(--line); }
.btn:hover { border-color: var(--ink-3); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn--quiet { background: none; border-color: transparent; color: var(--ink-2); font-weight: 500; }
.btn--quiet:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }
.btn--sm { height: 32px; padding: 0 11px; border-radius: 10px; font-size: 13px; }
.dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.dot--ok { background: var(--ok); } .dot--warn { background: var(--warn); } .dot--bad { background: var(--bad); }
.tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); } .tone-off { color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.muted { color: var(--ink-3); }
.st { font-size: 13px; }
.st--ok { color: var(--ok); } .st--warn { color: var(--warn); } .st--bad { color: var(--bad); } .st--off { color: var(--ink-3); }
.spark { display: block; }

/* ---- Сегодня ---- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
.figs { display: flex; padding: 16px 6px; }
.fig { padding: 0 20px; border-left: 1px solid var(--line); }
.fig:first-child { border: 0; }
.fig small { display: block; color: var(--ink-3); font-size: 13px; }
.fig b { display: block; font-size: 24px; letter-spacing: -.02em; line-height: 1.3; }
.fig span { font-size: 13px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 22px; }
.tile { padding: 14px 16px; }
.tile small { color: var(--ink-3); font-size: 13px; }
.tile b { display: block; font-size: 22px; letter-spacing: -.02em; }
.tile__foot { display: flex; align-items: end; justify-content: space-between; gap: 8px; min-height: 28px; font-size: 13px; color: var(--ink-2); }
.tile .spark { color: var(--accent); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
&[data-mode='pro'] .cols { grid-template-columns: minmax(0, 1fr); }
.task { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 10px; }
.task__ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); }
.task--urgent .task__ic { background: var(--bad-soft); color: var(--bad); }
.task--ai .task__ic { background: var(--accent-soft); color: var(--accent); }
.task__meta { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); }
.task h3 { font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; }
.task p { color: var(--ink-2); font-size: 14px; }
.task__acts { display: flex; align-items: center; gap: 4px; }
.task.is-closed { grid-template-columns: 40px 1fr auto; opacity: .75; box-shadow: none; border: 1px dashed var(--line); background: none; }
.task.is-closed .task__ic { background: var(--ok-soft); color: var(--ok); }
&[data-mode='pro'] .task { padding: 10px 14px; margin-bottom: 6px; border-radius: 12px; }
&[data-mode='pro'] .task__ic { width: 32px; height: 32px; border-radius: 9px; }
&[data-mode='pro'] .task h3 { font-size: 14.5px; }
&[data-mode='pro'] .task p { font-size: 13px; }
.diff { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 13px; }
.diff td { padding: 5px 0; border-top: 1px solid var(--line); }
.diff td + td { text-align: right; white-space: nowrap; padding-left: 16px; }
.diff s { color: var(--ink-3); }
.pcard { display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px; text-align: left; }
.pcard:hover { outline: 2px solid var(--accent-soft); }
.pcard__top { display: flex; align-items: center; gap: 8px; }
.pcard__top small { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.pcard__verdict { margin: 4px 0 8px 17px; font-size: 14px; font-weight: 500; }
.pcard__row { display: flex; align-items: end; justify-content: space-between; margin-left: 17px; color: var(--ink-2); font-size: 13px; }
.pcard .spark { color: var(--ink-3); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--ink-3); text-align: left; white-space: nowrap; }
.tbl td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl .r { text-align: right; }
.tbl small { display: block; color: var(--ink-3); font-size: 12px; }
.tbl tr.is-link:hover td { background: var(--surface-2); cursor: pointer; }
.tbl tr.is-sel td { background: var(--accent-soft); }
.scroll-x { overflow-x: auto; }

/* ---- Помощник ---- */
.chatpage { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
.chats { position: sticky; top: 88px; }
.chats .btn { width: 100%; margin-bottom: 12px; }
.chatlink { display: block; width: 100%; padding: 10px 12px; border-radius: 12px; text-align: left; }
.chatlink:hover { background: var(--surface); }
.chatlink.active { background: var(--surface); box-shadow: var(--shadow); }
.chatlink strong { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; font-size: 14px; }
.chatlink small { color: var(--ink-3); font-size: 12px; }
.talk { max-width: 780px; }
.talk__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.talk__head h1 { font-size: 22px; }
.msg--user { display: flex; justify-content: flex-end; margin-bottom: 20px; }
.msg--user div { max-width: 80%; padding: 12px 16px; border-radius: 18px 18px 4px 18px; background: var(--accent); color: var(--accent-ink); font-size: 16px; }
.msg--ai { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.msg__av { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); }
.msg__body { font-size: 16px; line-height: 1.6; }
.msg__body ol { margin: 10px 0; padding-left: 22px; }
.msg__body li { margin-bottom: 8px; }
.msg__body li span { color: var(--ink-2); }
.good { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); }
.good .ic { color: var(--ok); position: relative; top: 3px; }
.chartcard { margin: 16px 0; padding: 14px 16px 8px; }
.chartcard figcaption { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.chart { display: block; width: 100%; height: auto; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-tick { fill: var(--ink-3); font-size: 11px; }
.ch-label { fill: var(--ink-2); font-size: 11px; }
.ch-value { fill: var(--ink); font-size: 12px; font-weight: 600; }
.ch-week { fill: var(--ink-3); opacity: .08; }
.ch-target { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ch-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.ch-hit:hover .ch-dot { opacity: 1; }
.steps { margin: 12px 0; font-size: 14px; color: var(--ink-2); }
.steps summary { cursor: pointer; }
.steps ul { margin: 6px 0 0; padding-left: 20px; }
.prop { margin-top: 16px; padding: 18px 20px; border: 1.5px solid var(--accent); }
.prop__head { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.prop .diff { font-size: 15px; margin: 12px 0 4px; }
.prop .diff td { padding: 9px 0; }
.prop__effect { margin: 10px 0 14px; color: var(--ink-2); font-size: 15px; }
.prop__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.prop__acts small { flex-basis: 100%; color: var(--ink-3); font-size: 13px; }
.prop.is-closed { border-color: var(--line); box-shadow: none; }
.composer { position: sticky; bottom: 0; z-index: 5; margin-top: 14px; padding: 18px 0 16px; background: linear-gradient(to bottom, transparent, var(--bg) 14px); }
.starters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.starters button { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.starters button:hover { border-color: var(--accent); color: var(--accent); }
.composer__box { padding: 12px 12px 10px 16px; }
.composer textarea { display: block; width: 100%; min-height: 44px; border: 0; outline: 0; resize: none; background: none; font-size: 16px; }
.composer__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.models { display: flex; gap: 4px; }
.models button { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 9px; font-size: 13px; color: var(--ink-2); }
.models button.active { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .5; }
.dots i.on { background: currentColor; opacity: 1; }
.send { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }

/* ---- Кампании и запросы ---- */
.head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head__tools { display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); }
.search input { width: 170px; border: 0; outline: 0; background: none; }
.camp { display: grid; grid-template-columns: 44px minmax(0, 1.3fr) minmax(0, 1.2fr) 110px auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.camp:first-child { border-top: 0; }
.camp small { display: block; color: var(--ink-3); font-size: 13px; }
.camp__num { text-align: right; }
.switch { position: relative; width: 40px; height: 24px; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.check { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--ink-3); color: transparent; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bulk { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 6px; width: max-content; max-width: 100%; margin: 16px auto 0; padding: 8px 8px 8px 18px; border-radius: 16px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
.bulk .btn { background: none; border-color: transparent; color: inherit; }
.bulk .btn:hover { background: color-mix(in srgb, var(--bg) 16%, transparent); }
.bulk .btn--primary { background: var(--accent); color: var(--accent-ink); }
&[data-theme='dark'] .bulk .btn--primary { background: var(--accent-soft); color: var(--accent); }
.bars { color: var(--ink-3); }
.qblock { padding: 20px 22px; margin-top: 16px; }
.qblock__head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
.qblock h3 { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.qblock h3 + p { margin-top: 4px; color: var(--ink-2); max-width: 620px; }
.reason { margin-top: 14px; }
.reason > small { display: block; margin-bottom: 6px; color: var(--ink-3); font-size: 13px; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrase { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 12px; border-radius: 9px; background: var(--bad-soft); font-size: 14px; }
.phrase button { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--ink-3); }
.phrase button:hover { background: var(--surface); color: var(--ink); }
.phrase.is-kept { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }
.doubt { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.doubt small { display: block; color: var(--ink-2); font-size: 13px; }
.doubt .num { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.pick { display: flex; gap: 6px; }
.pick button { height: 34px; padding: 0 14px; white-space: nowrap; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; font-size: 14px; }
.pick button.yes.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pick button.no.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 18px 0 12px; }
.filters button { height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.filters button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.stub { padding: 60px 24px; text-align: center; color: var(--ink-2); }

@container (max-width: 1120px) {
  .brand span, .limit span { display: none; }
  .cols, .chatpage { grid-template-columns: minmax(0, 1fr); }
  .chats { position: static; }
  .hero { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@container (max-width: 860px) {
  .top { flex-wrap: wrap; gap: 6px 8px; height: auto; padding: 10px 12px 8px; }
  .tools { margin-left: auto; }
  .nav { order: 3; flex: 0 0 100%; flex-wrap: wrap; margin: 0; }
  .limit { display: none; }
  .task { grid-template-columns: 40px minmax(0, 1fr); }
  .task__acts { grid-column: 2; flex-wrap: wrap; }
  .camp { grid-template-columns: 44px 1fr auto; }
  .camp__health { grid-column: 2 / -1; }
}

}

.v2 {
& {
  --bg: #f4f4f1; --side: #ecece8; --surface: #fff; --surface-2: #f7f7f4; --ink: #141413; --ink-2: #5c5c57; --ink-3: #696963;
  --line: #e2e2dc; --lime: #c6f04a; --lime-soft: #eef8cf; --pri: #141413; --pri-ink: #fff; --series: #141413;
  --ok: #1a7f4e; --warn: #875d00; --bad: #c0392b;
  --shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 8px 24px rgba(20, 20, 19, .06);
}
&[data-theme='dark'] {
  --bg: #0f100f; --side: #151615; --surface: #1a1b1a; --surface-2: #212221; --ink: #f1f1ee; --ink-2: #a8a8a2; --ink-3: #8c8c85;
  --line: #2a2b29; --lime-soft: #2a3312; --pri: #c6f04a; --pri-ink: #141413; --series: #c6f04a;
  --ok: #5fd08f; --warn: #e6b450; --bad: #f08a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
}
& { overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.5 'Manrope', system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
b, strong { font-weight: 700; }

/* ---- боковая панель ---- */
.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: auto; padding: 14px 10px 12px; background: var(--side); }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
.brand i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--lime); color: #141413; font-style: normal; }
.newchat { display: flex; align-items: center; gap: 9px; flex: none; height: 40px; padding: 0 12px; margin-bottom: 8px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.newchat:hover { border-color: var(--ink-3); }
.srow { display: flex; align-items: center; gap: 10px; flex: none; width: 100%; height: 34px; padding: 0 10px; border-radius: 9px; color: var(--ink-2); font-weight: 600; font-size: 14px; text-align: left; }
.srow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
.srow.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.srow .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--lime); color: #141413; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.srow .pin { flex: none; width: 8px; height: 8px; margin: 0 1px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1.5px var(--ink); }
.side h4 { margin: 16px 10px 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.pop { position: relative; flex: none; }
.menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; font-weight: 500; }
.menu button:hover { background: var(--surface-2); }
.side__foot { margin-top: auto; padding: 18px 10px 4px; }
.limit { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.limit b { color: var(--ink); }
.limit__bar { height: 6px; margin: 6px 0; border-radius: 3px; background: var(--line); overflow: hidden; }
.limit__bar i { display: block; height: 100%; border-radius: 3px; background: var(--pri); }
.side__foot small { color: var(--ink-3); font-size: 12px; }

/* ---- общее ---- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mbar { flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; }
.mbar__title { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; font-size: 15px; white-space: nowrap; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip--btn:hover { border-color: var(--ink-3); color: var(--ink); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.dot--ok { background: var(--ok); } .dot--warn { background: var(--warn); } .dot--bad { background: var(--bad); }
.st { font-size: 12px; }
.st--ok { color: var(--ok); } .st--warn { color: var(--warn); } .st--bad { color: var(--bad); } .st--off { color: var(--ink-3); }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--side); }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.iconbtn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--ink-2); }
.iconbtn:hover, .iconbtn.on { background: var(--side); color: var(--ink); }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; }
.page { flex: 1; min-height: 0; overflow: auto; }
.col { max-width: 820px; margin: 0 auto; padding: 36px 24px 72px; }
.wide { max-width: 1100px; margin: 0 auto; padding: 12px 28px 32px; }
.eyebrow { color: var(--ink-3); font-size: 13px; font-weight: 600; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; }
.col > .eyebrow, .col > h1 { text-align: center; }
.col > h1 { font-size: 40px; }
h2 { display: flex; align-items: baseline; gap: 8px; margin: 34px 0 10px; font-size: 15px; font-weight: 800; }
h2 > span:not(.st) { color: var(--ink-3); font-weight: 600; }
h2 > .st { font-size: 14px; align-self: center; }
h2 small { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.muted { color: var(--ink-3); }
p.muted { font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn--pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn--pri:hover { border-color: var(--pri); filter: brightness(1.12); }
.btn--ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }
.btn--sm { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 13px; }
.btn--icon { width: 36px; padding: 0; }

/* ---- строка вопроса ---- */
.composer { padding: 12px 12px 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--ink-3); }
.composer textarea { display: block; width: 100%; padding: 2px 0 8px; border: 0; outline: 0; background: none; resize: none; font-size: 15px; line-height: 1.5; }
.composer textarea::placeholder, .askbar__box input::placeholder { color: var(--ink-3); }
.composer--big { margin-top: 26px; padding: 18px 14px 12px 22px; border-radius: 26px; }
.composer--big textarea { font-size: 17px; }
.composer__row { display: flex; align-items: center; gap: 8px; }
.composer__row .chip { background: var(--surface-2); }
.composer__row .send { margin-left: auto; }
.send { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: #141413; }
.send:hover { filter: brightness(.94); }
.starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.col > .starters { justify-content: center; }
.starters button { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.starters button:hover { border-color: var(--ink-3); color: var(--ink); }

/* ---- главная ---- */
.kline { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 30px; }
.kline > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 6px; padding: 14px 16px; border-left: 1px solid var(--line); }
.kline > div:first-child { border-left: 0; }
.kline small { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.kline b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.kline span { grid-column: 1 / -1; grid-row: 3; color: var(--ink-2); font-size: 12px; }
.kline .spark { grid-column: 2; grid-row: 2; color: var(--ink-3); }
.prow { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow > div:first-child { flex: 1; min-width: 0; }
.prow > div:first-child > small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.prow > div:first-child > b { display: block; font-size: 15px; }
.prow > div:first-child > p { color: var(--ink-2); font-size: 14px; }
.prow__acts { display: flex; align-items: center; gap: 6px; flex: none; }
.prow.is-closed > div:first-child > b { color: var(--ink-3); font-weight: 500; }
.diff { margin-top: 8px; border-collapse: collapse; font-size: 13px; }
.diff td { padding: 3px 16px 3px 0; color: var(--ink-2); }
.diff s { color: var(--ink-3); }
.diff b { color: var(--ink); }
.sigs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sig { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.sig__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.sig h3 { font-size: 15px; line-height: 1.35; font-weight: 700; }
.sig p { color: var(--ink-2); font-size: 14px; }
.sig__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; }
.sig__acts .btn { height: 36px; padding: 0 13px; }
.sig__acts .btn--icon { margin-left: auto; padding: 0; }
.sig.is-closed { flex-direction: row; align-items: center; justify-content: space-between; color: var(--ink-3); }
.sig.is-closed p { display: flex; align-items: center; gap: 8px; color: var(--ink-3); }
.pstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pc { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; padding: 14px 16px; text-align: left; }
.pc:hover { border-color: var(--ink-3); }
.pc > b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.pc p { color: var(--ink-2); font-size: 13px; line-height: 1.35; }
.pc__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; width: 100%; margin-top: 6px; color: var(--ink-3); font-size: 12px; line-height: 1.45; }

/* ---- чат и панель с данными ---- */
.chatwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.chatwrap.has-canvas { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.thread__scroll { flex: 1; min-height: 0; overflow: auto; }
.thread__in { max-width: 740px; margin: 0 auto; padding: 14px 28px 28px; }
.thread__foot { flex: none; width: 100%; max-width: 740px; margin: 0 auto; padding: 0 28px 16px; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 22px; }
.msg-user > div { max-width: 82%; padding: 11px 16px; border-radius: 18px 18px 4px 18px; background: var(--side); font-weight: 600; }
.msg-ai { display: flex; flex-direction: column; gap: 14px; line-height: 1.6; }
.msg-ai ol { display: grid; gap: 8px; margin: 0; padding-left: 22px; }
.refs { display: flex; flex-wrap: wrap; gap: 8px; }
.refs button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.refs button:hover { border-color: var(--ink-3); }
.fig.card { padding: 14px 16px 10px; }
.fig figcaption { margin-bottom: 6px; color: var(--ink-2); font-size: 13px; font-weight: 700; }
.good { display: flex; align-items: flex-start; gap: 8px; color: var(--ink-2); }
.good .ic { margin-top: 4px; color: var(--ok); }
.steps { color: var(--ink-2); font-size: 14px; }
.steps summary { width: fit-content; cursor: pointer; color: var(--ink-3); font-weight: 700; font-size: 13px; }
.steps ul { margin: 6px 0 0; padding-left: 20px; }
.ref { padding: 16px 18px; background: var(--lime-soft); border-color: transparent; }
.ref.is-closed { background: var(--surface); border-color: var(--line); }
.ref__head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--lime); color: #141413; font-size: 12px; font-weight: 700; }
.ref p { color: var(--ink-2); font-size: 14px; }
.ref__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.canvas { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 0 14px 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.canvas__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; }
.tabs button { height: 32px; padding: 0 12px; border-radius: 8px; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.canvas__body { container: canvas / inline-size; flex: 1; min-height: 0; overflow: auto; padding: 20px 22px; }
.canvas__body h3 { margin: 2px 0 4px; font-size: 21px; line-height: 1.25; font-weight: 800; letter-spacing: -.02em; }
.canvas__body .tbl, .canvas__body .fig { margin-top: 14px; }
.canvas__foot { flex: none; padding: 14px 22px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.canvas__foot > div { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.canvas__foot small { display: block; margin-top: 8px; color: var(--ink-3); font-size: 12px; line-height: 1.4; }
.notes { display: grid; gap: 8px; margin: 14px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.notes b { color: var(--ink); }
.effect { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.effect > div { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.effect small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.effect b { font-size: 15px; }
.hl { padding: 2px 7px; border-radius: 6px; background: var(--lime); color: #141413; }

/* ---- таблицы ---- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink-3); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl td small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.tbl td > b { font-weight: 600; }
.tbl s { color: var(--ink-3); }
.tbl tr.is-change td { background: var(--lime-soft); }
.tbl .bars { color: var(--ink-3); }
.tbl tr.grp td { padding: 8px 12px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.tbl tr.grp b { color: var(--ink); }
.grp__act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.card.scroll-x { overflow-x: auto; }

/* ---- кампании ---- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.wide > h2:first-of-type { margin-top: 18px; }
.check { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--ink-3); color: transparent; }
.check:hover { border-color: var(--ink); }
.check.on { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.switch { position: relative; display: block; flex: none; width: 36px; height: 20px; border-radius: 999px; background: var(--ink-3); transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(16px); }
.crow { display: grid; grid-template-columns: auto minmax(0, 1.3fr) minmax(0, 1fr) 96px auto; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow.is-sel { background: var(--lime-soft); }
.crow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.crow small { display: block; color: var(--ink-3); font-size: 12px; }
.crow__health { color: var(--ink-2); font-size: 14px; }
.crow__num { text-align: right; }
.askbar { flex: none; padding: 10px 28px 16px; border-top: 1px solid var(--line); }
.askbar__in { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; max-width: 1044px; margin: 0 auto; padding: 12px 12px 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.askbar__ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; color: var(--ink-2); font-size: 13px; }
.askbar__ctx .chip { height: 24px; background: var(--lime-soft); border-color: transparent; color: var(--ink); }
.askbar__ctx .chip button { display: grid; place-items: center; margin-right: -4px; color: var(--ink-2); }
.askbar .starters { grid-column: 2; grid-row: 1; margin: 0; }
.askbar .starters button { height: 28px; padding: 0 11px; font-size: 13px; background: var(--surface-2); }
.askbar__box { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.askbar__box input { flex: 1; min-width: 0; height: 36px; padding: 0; border: 0; outline: 0; background: none; font-size: 15px; }

/* ---- запросы ---- */
.summary { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding: 16px 18px; background: var(--lime-soft); border-color: transparent; }
.summary p { flex: 1; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rcard { display: flex; flex-direction: column; padding: 16px 18px; }
.rcard header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rcard h3 { font-size: 16px; font-weight: 800; }
.rcard header span { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.rcard ul { list-style: none; margin: 10px 0 12px; padding: 0; font-size: 14px; }
.rcard li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px dashed var(--line); color: var(--ink-2); }
.rcard li span { color: var(--ink-3); white-space: nowrap; }
.rcard footer { display: flex; align-items: center; gap: 6px; margin-top: auto; }
.rcard.is-done ul { opacity: .55; text-decoration: line-through; }
.qrow { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); }
.qrow:first-child { border-top: 0; }
.qrow > div:first-child { flex: 1; min-width: 0; }
.qrow b { display: block; font-weight: 700; }
.qrow small { color: var(--ink-3); font-size: 13px; }
.qrow > .num { font-size: 13px; white-space: nowrap; }
.pick { display: inline-flex; flex: none; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.pick button { height: 26px; padding: 0 11px; border-radius: 7px; color: var(--ink-2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.pick button:hover { color: var(--ink); }
.pick button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.pick .yes.on { color: var(--ok); }
.pick .no.on { color: var(--bad); }
.okrow { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 18px; color: var(--ink-2); font-size: 14px; }
.okrow .st { font-size: 14px; }
.okrow .btn { margin-left: auto; }

/* ---- график ---- */
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-tick { fill: var(--ink-3); font-size: 11px; }
.ch-label { fill: var(--ink-2); font-size: 11px; }
.ch-value { fill: var(--ink); font-size: 12px; font-weight: 700; }
.ch-week { fill: var(--ink-3); opacity: .08; }
.ch-target { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ch-line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-end { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.ch-dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.ch-hit:hover .ch-dot { opacity: 1; }

@container canvas (max-width: 550px) {
  .tbl .opt { display: none; }
  .tbl th, .tbl td { padding-left: 8px; padding-right: 8px; }
}
@container (max-width: 1180px) {
  .shell { grid-template-columns: 228px minmax(0, 1fr); }
  .pstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kline { grid-template-columns: repeat(2, 1fr); }
  .kline > div:nth-child(3) { border-left: 0; }
  .kline > div:nth-child(n + 3) { border-top: 1px solid var(--line); }
  .askbar__in { grid-template-columns: minmax(0, 1fr); }
  .askbar .starters { grid-column: 1; grid-row: auto; }
}
@container (max-width: 1040px) {
  .chatwrap.has-canvas { grid-template-columns: minmax(0, 1fr); }
  .canvas { position: absolute; top: 56px; right: 0; bottom: 0; z-index: 10; width: min(540px, calc(100% - 20px)); margin: 0 10px 10px 0; }
  .sigs, .rgrid { grid-template-columns: minmax(0, 1fr); }
  .prow, .qrow { flex-wrap: wrap; }
  .crow { grid-template-columns: auto minmax(0, 1fr) 96px auto; }
  .crow__health { grid-column: 2 / -1; grid-row: 2; margin-top: -10px; }
}
@container (max-width: 700px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .col > h1 { font-size: 30px; }
}

}

.v3 {
/* Вариант 3 «Пульт»: плотный рабочий стол, тёмная тема по умолчанию. Цифры — моноширинным шрифтом. */
& {
  --bg: #f3f5f8; --panel: #fff; --panel-2: #f7f9fb; --raise: #fff; --line: #dfe4ea;
  --ink: #111827; --ink-2: #4b5563; --ink-3: #5d6878;
  --accent: #1f5ae0; --accent-ink: #fff; --accent-soft: #e6eefd;
  --ok: #0a7447; --warn: #8f5800; --bad: #b02525;
  --hover: rgba(17, 24, 39, .05); --shadow: 0 12px 32px rgba(17, 24, 39, .16);
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  overflow: hidden; background: var(--bg); color: var(--ink);
  font: 13px/1.45 'Inter', system-ui, 'Segoe UI', sans-serif;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
&[data-theme='dark'] {
  --bg: #0d1014; --panel: #141920; --panel-2: #1a2029; --raise: #2b3442; --line: #232a34;
  --ink: #e6eaf0; --ink-2: #9aa5b4; --ink-3: #8a96a6;
  --accent: #5b9dff; --accent-ink: #08111f; --accent-soft: #16263f;
  --ok: #3ecf8e; --warn: #f5b83d; --bad: #ff6b6b;
  --hover: rgba(255, 255, 255, .05); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.muted { color: var(--ink-3); }
.st--ok { color: var(--ok); } .st--warn { color: var(--warn); } .st--bad { color: var(--bad); } .st--off { color: var(--ink-3); }
kbd { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink-2); font: 500 11px/18px var(--mono); }

/* ---------- каркас ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.body { position: relative; flex: 1; display: flex; min-height: 0; }
.main { flex: 1; min-width: 0; overflow: auto; padding: 14px 16px 28px; container: main / inline-size; }
&[data-screen='chat'] .main { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 1480px; }

/* ---------- левая колонка: разделы и проекты ---------- */
.rail { display: flex; flex-direction: column; gap: 1px; padding: 10px 8px; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
.rail > * { flex: none; }
.brand { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px; margin-bottom: 8px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.brand i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.nv, .pj { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--ink-2); text-align: left; }
.nv:hover, .pj:hover { background: var(--hover); color: var(--ink); }
.nv.active, .pj.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nv.active .ic { color: var(--accent); }
.nv .t, .pj .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nv i, .aibtn i, .tabs i { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--mono); text-align: center; }
.rail__projects { display: flex; flex-direction: column; gap: 1px; margin: 12px 0; padding-top: 10px; border-top: 1px solid var(--line); }
.rail__projects h4 { padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.client { padding: 8px 8px 2px; font-size: 11px; color: var(--ink-3); }
.pj { height: 28px; }
.pj .num { font: 500 11.5px var(--mono); color: var(--ink-3); }
/* Состояние проекта — цветом и формой: круг, ромб, квадрат. */
.dot { flex: none; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--ink-3); }
.dot--ok { background: var(--ok); }
.dot--warn { background: var(--warn); border-radius: 1.5px; transform: rotate(45deg); }
.dot--bad { background: var(--bad); border-radius: 1.5px; }
.rail__foot { display: grid; gap: 6px; margin-top: auto; padding: 12px 8px 2px; border-top: 1px solid var(--line); }
.limit { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; }
.limit b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
.limit__bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.limit__bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.rail__foot small { color: var(--ink-3); font-size: 11.5px; }
.svc { display: flex; gap: 2px; margin: 2px -6px 0; }
.svc button { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--ink-3); }
.svc button:hover { background: var(--hover); color: var(--ink); }

/* ---------- верхняя полоса ---------- */
.bar { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; margin-right: auto; color: var(--ink-2); white-space: nowrap; }
.crumbs span { overflow: hidden; text-overflow: ellipsis; }
.crumbs b { font-size: 14px; font-weight: 600; color: var(--ink); }
.crumbs .ic { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.cmd { display: flex; align-items: center; gap: 7px; width: 216px; height: 28px; padding: 0 5px 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink-3); }
.cmd span { flex: 1; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: flex; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.seg button { height: 22px; padding: 0 9px; border-radius: 5px; color: var(--ink-2); font-size: 12.5px; }
.seg button.active { background: var(--raise); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.iconbtn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--ink-2); }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.aibtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; font-weight: 600; }
.aibtn .ic { color: var(--accent); }
.aibtn:hover { border-color: var(--accent); }
.aibtn.on { background: var(--accent-soft); border-color: transparent; }
.avatar { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--panel-2); font-size: 12px; font-weight: 600; }

/* ---------- кнопки и общие блоки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn--pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn--pri:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn--ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn--ghost:hover { border-color: transparent; background: var(--hover); color: var(--ink); }
.btn--icon { width: 28px; padding: 0; }
.btn--block { width: 100%; }
.panel { min-width: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.panel__head { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.panel__head h2 { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.panel__head h2 .num { color: var(--ink-3); font: 500 12px var(--mono); }
.panel__head small { margin-left: auto; color: var(--ink-3); font-size: 12px; text-align: right; }
.empty { padding: 12px 14px; color: var(--ink-3); font-size: 12.5px; }
.find { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink-3); }
.find input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 12.5px; }
.find input::placeholder, .composer textarea::placeholder { color: var(--ink-3); }

/* ---------- таблицы ---------- */
.scroll-x { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); color: var(--ink-3); font-size: 11.5px; font-weight: 500; text-align: left; white-space: nowrap; }
.tbl td { height: 34px; padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th.r, .tbl td.r { text-align: right; white-space: nowrap; }
.tbl td.r { font-family: var(--mono); font-size: 12.5px; }
.tbl td b { font-weight: 600; }
.tbl td small { display: block; color: var(--ink-3); font: 400 11.5px/1.35 'Inter', system-ui, sans-serif; }
.tbl .w0 { width: 1%; padding-right: 2px; white-space: nowrap; }
.tbl tr:hover td { background: var(--hover); }
.tbl tr.is-link { cursor: pointer; }
.tbl tr.is-sel td { background: var(--accent-soft); }
.tbl tr.total td { background: var(--panel-2); font-weight: 600; }
.tbl tr.is-closed td { color: var(--ink-3); }
.tbl td.acts { text-align: right; white-space: nowrap; }
.tbl td.acts .btn { margin-left: 4px; vertical-align: middle; }
.tbl--alerts td:first-child { width: 1%; white-space: nowrap; }
.tbl--alerts td small { margin-top: 1px; font-size: 12.5px; color: var(--ink-2); }
.tbl--roomy td { height: 48px; }
.tbl--roomy td small { margin-top: 1px; }
.tbl .spark, .tbl .bars { color: var(--accent); }

/* ---------- Сводка ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.kpi { display: grid; gap: 2px; min-width: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.kpi small { overflow: hidden; color: var(--ink-2); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.kpi b { font: 600 19px/1.3 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
.kpi__foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.kpi__foot i { font-style: normal; font-weight: 600; color: var(--ink-2); }
.kpi__foot i.up { color: var(--ok); }
.kpi__foot .spark { color: var(--accent); }
.kpi--link:hover, .fig--link:hover { border-color: var(--accent); }
.kpi--link b, .fig--link b { color: var(--accent); }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fig { display: grid; gap: 2px; min-width: 0; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.fig small { color: var(--ink-2); font-size: 12.5px; }
.fig b { font: 600 24px/1.25 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
.fig span { color: var(--ink-3); font-size: 12.5px; }
.fig span.up { color: var(--ok); font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px; }
.pcard { display: grid; gap: 4px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); text-align: left; }
.pcard:hover, .pcard.active { border-color: var(--accent); }
.pcard__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pcard__top b { overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.pcard p { color: var(--ink-2); }
.pcard__row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; color: var(--ink-3); font-size: 12.5px; }
.pcard__row .spark { color: var(--accent); }

/* ---------- панель ИИ ---------- */
.dock { flex: none; display: flex; flex-direction: column; width: 340px; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.dock__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 42px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; align-self: stretch; gap: 16px; }

/* ---------- форматирование ---------- */

const num = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')
const rub = (n) => `${num(n)} ₽`
const delta = (d) => `${d > 0 ? '+' : '−'}${Math.abs(d)}%`
const project = (id) => M.projects.find((p) => p.id === id)
const projectName = (id) => (id ? project(id).name : 'Все проекты')
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

/** «Заявка 402 ₽ при цели 450 ₽» или «ДРР 14% при цели 18%». */
function kpiText(p) {
  return p.kpi === 'CPA' ? `Заявка ${rub(p.value)} при цели ${rub(p.target)}` : `ДРР ${p.value}% при цели ${p.target}%`
}
/** Короткий вывод простыми словами. */
function kpiVerdict(p) {
  const d = Math.round((p.value / p.target - 1) * 100)
  if (d <= 0) return p.kpi === 'CPA' ? `Заявки на ${-d}% дешевле цели` : 'Расходы в пределах цели'
  return p.kpi === 'CPA' ? `Заявки на ${d}% дороже цели` : `Расходы на ${d}% выше цели`
}
/** Что с кампанией — одной фразой, без терминов. */
function campHealth(c) {
  const p = project(c.project)
  if (!c.on) return 'Остановлена 3 ноября'
  if (c.drr != null) return c.drr <= p.target ? `ДРР ${c.drr}% — в цели` : `ДРР ${c.drr}% — чуть выше цели ${p.target}%`
  if (!c.conv) return `${rub(c.cost)} за неделю, заявок нет`
  const d = Math.round((c.cpa / p.target - 1) * 100)
  if (d <= 0) return `Заявка ${rub(c.cpa)} — в цели`
  return d > 30 ? `Заявка ${rub(c.cpa)} — на ${d}% дороже цели` : `Заявка ${rub(c.cpa)} — чуть дороже цели ${rub(p.target)}`
}
const campKpi = (c) => (c.drr != null ? `${c.drr}%` : c.cpa ? rub(c.cpa) : '—')

/** Спарклайн: линия 2px с лёгкой заливкой, цвет берётся из currentColor. */
function spark(a, w = 96, h = 28) {
  const mx = Math.max(...a)
  const mn = Math.min(...a)
  const r = mx - mn || 1
  const pts = a.map((v, i) => [(i / (a.length - 1)) * w, h - 3 - ((v - mn) / r) * (h - 6)])
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')
  const last = pts[pts.length - 1]
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="currentColor" opacity=".1"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="currentColor"/></svg>`
}

/** Мини-столбики по дням (конверсии кампании). */
function bars(a, w = 56, h = 20) {
  const mx = Math.max(...a, 1)
  const bw = w / a.length
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${a
    .map((v, i) => {
      const bh = Math.max(2, (v / mx) * h)
      return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="currentColor" opacity="${v ? 0.85 : 0.25}"/>`
    })
    .join('')}</svg>`
}

/** График «цена заявки по дням» из ответа ИИ: одна серия, линия цели, подсказка при наведении. */
function cpaChart(w = 560, h = 170) {
  const { cpa, days, target } = M.chat
  const padL = 40
  const padB = 22
  const padT = 14
  const lo = 320
  const hi = 470
  const x = (i) => padL + (i / (cpa.length - 1)) * (w - padL - 12)
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB)
  const d = cpa.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')
  const grid = [350, 400, 450]
    .map((v) => `<line x1="${padL}" x2="${w - 12}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="ch-tick">${v}</text>`)
    .join('')
  const ticks = [0, 3, 7, 10, 13].map((i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle" class="ch-tick">${days[i]}</text>`).join('')
  const hits = cpa
    .map((v, i) => `<g class="ch-hit"><rect x="${x(i) - 18}" y="0" width="36" height="${h - padB}" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="4.5" class="ch-dot"/><title>${days[i]}: ${v} ₽</title></g>`)
    .join('')
  const wk = x(6.5)
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Цена заявки по дням, рубли">
    ${grid}
    <rect x="${wk}" y="${padT}" width="${w - 12 - wk}" height="${h - padT - padB}" class="ch-week"/>
    <line x1="${padL}" x2="${w - 12}" y1="${y(target)}" y2="${y(target)}" class="ch-target"/>
    <text x="${w - 14}" y="${y(target) - 6}" text-anchor="end" class="ch-label">цель ${target} ₽</text>
    <text x="${wk + 8}" y="${padT + 12}" class="ch-tick">прошлая неделя</text>
    <path d="${d}" class="ch-line"/>
    <circle cx="${x(13)}" cy="${y(cpa[13])}" r="4" class="ch-end"/>
    <text x="${x(13) - 8}" y="${y(cpa[13]) + 18}" text-anchor="end" class="ch-value">${cpa[13]} ₽</text>
    <text x="${x(0) + 6}" y="${y(cpa[0]) + 18}" class="ch-value">${cpa[0]} ₽</text>
    ${ticks}${hits}
  </svg>`
}

function readHash() {
  const out = {}
  for (const p of location.hash.slice(1).split(',').filter(Boolean)) {
    if (VARIANTS[p]) out.variant = p
    else if (['simple', 'pro'].includes(p)) out.mode = p
    else if (['light', 'dark'].includes(p)) out.theme = p
    else if (M.projects.some((x) => x.id === p)) out.project = p
    else out.screen = p
  }
  return out
}

/** Запускает макет: после каждого действия экран перерисовывается целиком, состояние хранится в адресе. */
function boot() {
  const app = document.getElementById('app')
  const bar = document.getElementById('bar')
  let fresh = true

  function load() {
    const h = readHash()
    Object.assign(S, { project: null }, h)
    if (h.theme) S.themeSet = true
    else if (!S.themeSet) S.theme = VARIANTS[S.variant].theme || 'light'
  }

  function paint() {
    const keep = {}
    if (!fresh) app.querySelectorAll('[data-scroll]').forEach((el) => (keep[el.dataset.scroll] = el.scrollTop))
    fresh = false
    const V = VARIANTS[S.variant]
    app.innerHTML = frame(S.variant, ' data-scroll="page"')
    app.querySelectorAll('[data-scroll]').forEach((el) => (el.scrollTop = keep[el.dataset.scroll] || 0))
    bar.innerHTML = `<strong>Макеты кабинета</strong><nav>${[['gallery', 'Сравнение'], ['v1', '1 · Сегодня'], ['v2', '2 · Диалог'], ['v3', '3 · Пульт']]
      .map(([k, label]) => `<button class="${S.variant === k ? 'active' : ''}" data-act="variant:${k}">${label}</button>`)
      .join('')}</nav><span>Данные вымышленные и одинаковые во всех вариантах · всё кликабельно</span>`
    document.title = `${V.name} — макеты AiMarketing`
    try {
      history.replaceState(null, '', `#${[S.variant, S.screen, S.mode, S.themeSet && S.theme, S.project].filter(Boolean).join(',')}`)
    } catch (e) {
      /* в предпросмотре без адреса состояние просто не запоминается */
    }
    if (V.after) V.after(app)
  }

  const ACT = {
    variant: (v) => {
      S.variant = v
      if (!S.themeSet) S.theme = VARIANTS[v].theme || 'light'
      if (!SCREEN_NAMES[S.screen]) S.screen = 'home'
      fresh = true
    },
    go: (v) => {
      S.screen = v
      S.sel.clear()
      fresh = true
    },
    mode: (v) => (S.mode = v),
    theme: () => {
      S.theme = S.theme === 'dark' ? 'light' : 'dark'
      S.themeSet = true
    },
    project: (v) => (S.project = v || null),
    menu: (v) => (S.menu = S.menu === v ? null : v),
    panel: () => (S.panel = !S.panel),
    tab: (v) => {
      S.tab = v
      S.panel = true
    },
    dock: () => (S.dock = !S.dock),
    docktab: (v) => {
      S.docktab = v
      S.dock = true
    },
    done: (v) => (S.decided[v] = 'done'),
    reject: (v) => (S.decided[v] = 'rejected'),
    later: (v) => (S.decided[v] = 'later'),
    undo: (v) => delete S.decided[v],
    sel: (v) => (S.sel.has(+v) ? S.sel.delete(+v) : S.sel.add(+v)),
    selnone: () => S.sel.clear(),
    minus: (v) => (S.minus.has(v) ? S.minus.delete(v) : S.minus.add(v)),
    verdict: (v) => {
      const [id, val] = v.split('=')
      S.verdicts[id] = S.verdicts[id] === val ? null : val
    },
    model: (v) => (S.model = v === 'next' ? (S.model + 1) % 3 : +v),
    qfilter: (v) => {
      S.qfilter = v
      S.cursor = 0
    },
    /* Включить или остановить кампанию: остановленная запоминает, какой была. */
    toggle: (v) => {
      const c = M.campaigns.find((x) => x.id === +v)
      c.on = !c.on
      if (c.on) c.health = c.was || 'warn'
      else {
        c.was = c.health === 'off' ? 'warn' : c.health
        c.health = 'off'
      }
    },
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]')
    if (!el) {
      if (S.menu) {
        S.menu = null
        paint()
      }
      return
    }
    const i = el.dataset.act.indexOf(':')
    const name = i < 0 ? el.dataset.act : el.dataset.act.slice(0, i)
    const arg = i < 0 ? '' : el.dataset.act.slice(i + 1)
    if (name !== 'menu') S.menu = null
    const fn = (VARIANTS[S.variant].actions || {})[name] || ACT[name]
    if (fn) fn(arg, el)
    if (el.dataset.then) ACT.go(el.dataset.then)
    paint()
  })
  document.addEventListener('keydown', (e) => {
    const V = VARIANTS[S.variant]
    const t = e.target
    if (!V.keys || e.ctrlKey || e.metaKey || e.altKey || (t && t.closest && t.closest('input, textarea'))) return
    if (V.keys(e)) {
      e.preventDefault()
      paint()
    }
  })
  window.addEventListener('hashchange', () => {
    load()
    fresh = true
    paint()
  })
  window.addEventListener('resize', () => {
    const V = VARIANTS[S.variant]
    if (V.after) V.after(app)
  })

  load()
  paint()
}

function camps() {

    return head + Object.entries(HEALTH).map(([h, label]) => {
      const rows = list.filter((c) => c.health === h)

      return `<h2><span class="dot dot--${h}"></span>${label} <span>${rows.length}</span></h2><div class="card">${rows.map((c) => `<div class="camp">
        <button class="switch ${c.on ? 'on' : ''}" role="switch" aria-checked="${c.on}" aria-label="${c.on ? 'Остановить' : 'Запустить'}" data-act="toggle:${c.id}"></button>
        <div><strong>${c.name}</strong><small>${c.type}${S.project ? '' : ' · ' + project(c.project).name}</small></div>
        <div class="camp__health tone-${h}">${campHealth(c)}</div>
        <div class="camp__num num"><b>${rub(c.cost)}</b><small>${c.conv} ${c.drr != null ? plural(c.conv, 'заказ', 'заказа', 'заказов') : plural(c.conv, 'заявка', 'заявки', 'заявок')}</small></div>

    <div class="filters"><button class="active">Все ${list.length}</button><button>Идут ${list.filter((c) => c.on).length}</button><button>Остановлены ${list.filter((c) => !c.on).length}</button><button>С проблемами ${list.filter((c) => c.health === 'bad' || c.health === 'warn').length}</button><span class="chip" style="margin-left:auto">Период: 7 дней ${ic('down', 13)}</span></div>

      <tr><th></th><th>Кампания</th><th>Статус</th><th class="r">Расход</th><th class="r">Клики</th><th class="r">Конверсии</th><th class="r">CPA / ДРР</th><th>По дням</th></tr>

        <td><b>${c.name}</b><small>${c.type}${S.project ? '' : ' · ' + project(c.project).name}</small></td>

function queries() {
  const t = M.queryTotals
  const done = S.decided.minus === 'done'
  const head = `<div class="head"><div><p class="eyebrow">okna-profi.ru · новые запросы за 7 дней</p><h1>Чистка запросов</h1>
    <p class="lead">ИИ разметил ${t.all} запросов, по которым показывалась реклама. Вам остаётся подтвердить.</p></div></div>`
  if (!pro()) {
    const kept = M.queries.filter((q) => q.v === 'no' && S.verdicts[q.id] === 'yes').length
    return `${head}
    <div class="qblock card">
      <div class="qblock__head"><div><h3><span class="dot dot--bad"></span>Мусор — ${t.no - kept} ${plural(t.no - kept, 'запрос', 'запроса', 'запросов')} · ${rub(t.noCost)} за неделю</h3>
        <p>Люди искали не то, что вы продаёте. Добавьте эти запросы в минус-фразы — реклама перестанет по ним показываться.</p></div>
        ${done ? `<button class="btn" data-act="undo:minus">${ic('undo', 15)}Вернуть</button>` : `<button class="btn btn--primary" data-act="done:minus">${ic('check', 16)}Убрать все ${t.no - kept}</button>`}</div>
      ${done ? `<p class="good" style="margin-top:14px">${ic('check', 16)}<span>Готово: ${t.no - kept} минус-фраз добавлены. Экономия — около ${rub(t.noCost)} в неделю.</span></p>` : Object.entries(M.reasons).map(([k, r]) => {
        const qs = M.queries.filter((q) => q.r === k)
        return `<div class="reason"><small>${r.label} · ${r.count} · ${rub(r.cost)}</small><div class="phrases">${qs.map((q) => `<span class="phrase ${S.verdicts[q.id] === 'yes' ? 'is-kept' : ''}">${q.q}<button title="Это наш запрос — оставить" data-act="verdict:${q.id}=yes">${ic(S.verdicts[q.id] === 'yes' ? 'undo' : 'x', 14)}</button></span>`).join('')}${r.count > qs.length ? `<span class="chip" style="height:32px">ещё ${r.count - qs.length}</span>` : ''}</div></div>`
      }).join('')}
    </div>
    <div class="qblock card">
      <h3><span class="dot dot--warn"></span>Сомнительные — ${t.maybe}</h3><p>ИИ не уверен. Решите сами — он запомнит ваш выбор для похожих запросов.</p>
      <div style="margin-top:10px">${M.queries.filter((q) => q.v === 'maybe').map((q) => `<div class="doubt"><div><b>${q.q}</b><small>${q.why}</small></div>
        <span class="num">${q.clicks} ${plural(q.clicks, 'клик', 'клика', 'кликов')} · ${rub(q.cost)}${q.conv ? ' · 1 заявка' : ''}</span>
        <div class="pick"><button class="yes ${S.verdicts[q.id] === 'yes' ? 'on' : ''}" data-act="verdict:${q.id}=yes">Наш</button><button class="no ${S.verdicts[q.id] === 'no' ? 'on' : ''}" data-act="verdict:${q.id}=no">Не наш</button></div></div>`).join('')}</div>
    </div>
    <div class="qblock card"><div class="qblock__head"><div><h3><span class="dot dot--ok"></span>Полезные — ${t.yes}</h3><p>С ними всё в порядке, делать ничего не нужно.</p></div><button class="btn btn--quiet">Показать${ic('down', 15)}</button></div></div>`
  }
  const f = S.qfilter || 'all'
  const list = M.queries.filter((q) => f === 'all' || verdictOf(q) === f)
  const V = { no: ['bad', 'Мусор'], maybe: ['warn', 'Сомнительный'], yes: ['ok', 'Полезный'] }
  const toMinus = t.no + M.queries.filter((q) => q.v !== 'no' && S.verdicts[q.id] === 'no').length - M.queries.filter((q) => q.v === 'no' && S.verdicts[q.id] === 'yes').length
  return `${head}
    <div class="filters">${[['all', 'Все', t.all], ['no', 'Мусор', t.no], ['maybe', 'Сомнительные', t.maybe], ['yes', 'Полезные', t.yes]].map(([k, l, n]) => `<button class="${f === k ? 'active' : ''}" data-act="qfilter:${k}">${l} ${n}</button>`).join('')}
      <label class="search" style="margin-left:auto;height:34px">${ic('search', 15)}<input placeholder="Слово в запросе"></label><span class="chip" style="height:34px">Куда: список «Общий» ${ic('down', 13)}</span></div>
    <div class="card scroll-x"><table class="tbl num">
      <tr><th>Запрос</th><th>Разметка ИИ</th><th class="r">Клики</th><th class="r">Расход</th><th class="r">Конверсии</th><th class="r">Ваше решение</th></tr>
      ${list.map((q) => { const v = verdictOf(q); return `<tr><td><b>${q.q}</b></td><td><span class="tone-${V[q.v][0]}"><span class="dot dot--${V[q.v][0]}"></span> ${V[q.v][1]}</span><small>${q.r ? M.reasons[q.r].label : q.why || 'Есть заявки'}</small></td>
        <td class="r">${q.clicks}</td><td class="r">${rub(q.cost)}</td><td class="r">${q.conv || '—'}</td>
        <td class="r"><div class="pick" style="justify-content:flex-end"><button class="yes ${v === 'yes' ? 'on' : ''}" data-act="verdict:${q.id}=yes">Наш</button><button class="no ${v === 'no' ? 'on' : ''}" data-act="verdict:${q.id}=no">Не наш</button></div></td></tr>` }).join('')}
    </table></div>
    <div class="bulk"><span>${done ? 'Минус-фразы добавлены' : `В минус-фразы: ${toMinus} ${plural(toMinus, 'запрос', 'запроса', 'запросов')} · ${rub(t.noCost)} за неделю`}</span>${done ? `<button class="btn btn--sm" data-act="undo:minus">${ic('undo', 14)}Вернуть</button>` : `<button class="btn btn--sm btn--primary" data-act="done:minus">${ic('check', 14)}Добавить</button>`}</div>`
}

function signal(t) {
  const st = S.decided[t.id]
  const p = t.project && project(t.project)
  if (st) return `<article class="sig is-closed"><p>${ic('check', 16)}<s>${t.title}</s> · ${st === 'later' ? 'скрыто до завтра' : 'готово'}</p><button class="btn btn--ghost btn--sm" data-act="undo:${t.id}">${ic('undo', 14)}Вернуть</button></article>`
  const [tone, label] = TONE[t.group]
  const act = t.go ? `go:${t.go}` : t.ai ? 'go:chat' : `done:${t.id}`
  return `<article class="sig">
    <div class="sig__top">${badge(tone, label)}<span>${p ? p.name : 'Все проекты'}</span></div>
    <h3>${t.title}</h3>${pro() ? '' : `<p>${t.text}</p>`}
    <div class="sig__acts"><button class="btn ${t.ai ? 'btn--pri' : ''}" data-act="${act}">${t.ai ? ic('sparkles', 15) : ''}${t.primary}${t.external ? ic('external', 14) : ''}</button>
      ${t.ai || t.external ? '' : `<button class="btn btn--ghost" data-act="go:chat" title="Спросить ИИ об этом">${ic('sparkles', 15)}Спросить</button>`}
      <button class="btn btn--ghost btn--icon" data-act="later:${t.id}" title="Скрыть до завтра" aria-label="Скрыть до завтра">${ic('x', 15)}</button></div>
  </article>`
}

function prow(t) {
  const st = S.decided[t.id]
  const p = project(t.project)
  if (st) return `<div class="prow is-closed"><div><small>${p.name}</small><b><s>${t.title}</s></b></div>
