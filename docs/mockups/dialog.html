function campList() {
  const st = pro() ? val('cstate', CSTATES[0]) : CSTATES[0]
  const q = val('cq', '').trim().toLowerCase()
  const cab = val('ccab', 'Все кабинеты')
  return visibleCampaigns().filter((c) => {
    if ((st === 'В архиве') !== !!c.archived) return false
    if (st === 'Идут показы' && !c.on) return false
    if (st === 'Остановлены' && c.on) return false
    if (!pro()) return true
    if (q && !c.name.toLowerCase().includes(q)) return false
    if (on('noconv') && c.conv) return false
    return S.project || cab === 'Все кабинеты' || CAB[c.project] === cab
  })
}

function camps() {
  const list = campList()
  const sel = list.filter((c) => S.sel.has(c.id))
  const k = CPERIODS[val('cper', 'За 7 дней')]
  const cost = (c) => rub(Math.round((c.cost * k) / 10) * 10)
  const conv = (c) => Math.round(c.conv * k)
  const where = (c) => `${c.type}${S.project ? '' : ` · ${project(c.project).name}`}`
  const check = (c) => checkBtn(`sel:${c.id}`, S.sel.has(c.id), `Выбрать «${c.name}»`)
  const empty = `<div class="card empty empty--sm">${ic('search', 24)}<p>Под эти условия ничего не подходит.</p><div><button class="btn" data-act="resetf">Сбросить фильтры</button></div></div>`
  let body
  if (!list.length) body = pro() ? empty : `<div class="card empty empty--sm">${ic('megaphone', 24)}<p>Кампаний пока нет. ИИ соберёт первую по шагам — от целей до объявлений.</p><div><button class="btn btn--pri" data-act="chat:c4">${ic('sparkles', 16)}Собрать кампанию с ИИ</button></div></div>`
  else if (pro()) {
    const all = list.every((c) => S.sel.has(c.id))
    body = `<div class="card scroll-x"><table class="tbl num">
      <tr><th>${checkBtn('selall', all, 'Выбрать все')}</th><th>Кампания</th><th>Состояние</th><th class="r lg">Бюджет в неделю</th><th class="r">Расход</th><th class="r xl">Клики</th><th class="r md">Конверсии</th><th class="r">CPA / ДРР</th><th class="xl">По дням</th><th></th></tr>
      ${list.map((c) => `<tr class="${S.sel.has(c.id) ? 'is-change' : ''}"><td>${check(c)}</td><td>${campName(c)}<small>${where(c)} · ${CAB[c.project]}</small></td><td>${c.archived ? '<span class="st st--off">В архиве</span>' : badge(c.health)}</td>
        <td class="r lg">${rub(budgetOf(c))}</td><td class="r">${cost(c)}</td><td class="r xl">${num(c.clicks * k)}</td><td class="r md">${conv(c)}</td><td class="r"><b>${campKpi(c)}</b></td><td class="xl">${bars(c.spark)}</td>
        <td>${c.archived ? `<button class="btn btn--ghost btn--sm" data-act="unarch:${c.id}">Вернуть</button>` : campSwitch(c)}</td></tr>`).join('')}
    </table></div>`
  } else {
    body = Object.entries(HEALTH).map(([h, label]) => {
      const rows = list.filter((c) => c.health === h)
      if (!rows.length) return ''
      return `<h2>${badge(h, label)}<span>${rows.length}</span></h2><div class="card">${rows.map((c) => `<div class="crow ${S.sel.has(c.id) ? 'is-sel' : ''}">${check(c)}
        <div>${campName(c)}<small>${where(c)}</small></div>
        <div class="crow__health">${campHealth(c)}</div>
        <div class="crow__num num"><b>${cost(c)}</b><small>${conv(c)} ${convWord(conv(c), project(c.project))}</small></div>
        ${campSwitch(c)}</div>`).join('')}</div>`
    }).join('')
  }
  const fbar = pro() ? `<div class="fbar">${search('cq', 'Найти кампанию')}${dd('cstate', CSTATES, CSTATES[0])}${S.project ? '' : dd('ccab', ['Все кабинеты', ...new Set(Object.values(CAB))], 'Все кабинеты')}${chipFlag('noconv', 'Без конверсий')}</div>` : ''
  const bulk = pro() && sel.length ? `<div class="bulk"><b>Выбрано: ${sel.length}</b>
    <button class="btn btn--sm" data-act="bulk:start">${ic('play', 14)}Запустить</button><button class="btn btn--sm" data-act="bulk:stop">${ic('pause', 14)}Остановить</button>
    <button class="btn btn--sm" data-act="modal:bulkbudget">Бюджет и стратегия…</button><button class="btn btn--sm" data-act="bulk:copy">${ic('copy', 14)}Копировать</button>
    <button class="btn btn--sm" data-act="bulk:archive">${ic('archive', 14)}В архив</button><button class="btn btn--sm" data-act="modal:delcamps">${ic('trash', 14)}Удалить</button>
    <button class="btn btn--ghost btn--sm" data-act="selnone">Снять выбор</button></div>` : ''
  const prompts = sel.length ? ['Почему у них дорогая заявка?', 'Что из этого отключить?', 'Сравни их между собой'] : ['Какие тратят впустую?', 'Что отключить?', 'Куда добавить бюджет?']
  return `<div class="page" data-scroll="main"><div class="wide">
      <div class="head"><div><p class="eyebrow">${projectName(S.project)}</p><h1>Кампании</h1></div>
        <div class="head__acts">${dd('cper', Object.keys(CPERIODS), 'За 7 дней')}
          ${pro() ? `<button class="btn" data-act="go:wizard">${ic('plus', 16)}Создать вручную</button>` : ''}<button class="btn btn--pri" data-act="chat:c4">${ic('sparkles', 16)}${pro() ? 'Собрать с ИИ' : 'Собрать новую с ИИ'}</button></div></div>
      ${fbar}${bulk}${body}
      ${list.length ? expertHint('Фильтры, архив, массовые действия и создание кампании вручную') : ''}
    </div></div>
    <div class="askbar"><div class="askbar__in">
      <div class="askbar__ctx">${ic('sparkles', 15)}${sel.length
        ? `<b>Выбрано ${sel.length}:</b>${sel.map((c) => `<span class="chip">${c.name}<button data-act="sel:${c.id}" aria-label="Убрать">${ic('x', 12)}</button></span>`).join('')}`
        : `<span>Вопрос про <b>все ${selWord(list.length).replace('кампания', 'кампанию')}</b> — или отметьте нужные галочкой</span>`}</div>
      <div class="askbar__box"><input placeholder="Спросите про эти кампании…" aria-label="Вопрос про кампании"><button class="send" data-act="chat:c1" aria-label="Спросить">${ic('up')}</button></div>
      <div class="starters">${prompts.map((s) => `<button data-act="chat:c1">${s}</button>`).join('')}</div>
    </div></div>`
}

/* ---------- страница кампании ---------- */

function campBudget(c) {
  if (val('bedit', '0') === '1') return `<div class="card pad brow">${field('budget', 'Недельный бюджет', num(budgetOf(c)), { unit: '₽', w: 120 })}
    <div class="brow__acts"><button class="btn btn--pri" data-act="savebudget">Сохранить</button><button class="btn" data-act="set:bedit=0">Отмена</button></div></div>`
  return `<div class="card pad brow"><div><small class="cap">Недельный бюджет</small><b class="big num">${rub(budgetOf(c))}</b>
    <p class="muted">За эту неделю потрачено ${rub(c.cost)} — ${Math.round((c.cost / budgetOf(c)) * 100)}% бюджета.</p></div><button class="btn" data-act="editbudget">Изменить</button></div>`
}

function campGroupsTab(c) {
  const open = +val('grp', '0')
  return `${sampleNote(c)}${M.campGroups.map((g, i) => {
    const body = open !== i ? '' : `<div class="acc__body">
      <h4>Объявления</h4>
      <div class="scroll-x"><table class="tbl num"><tr><th>Заголовок</th><th class="r">CTR на поиске</th><th class="r">CTR в сетях</th><th>Статус</th><th></th></tr>
        ${M.campAds.slice(0, g.ads).map((a) => `<tr><td>${a[0]}</td><td class="r">${a[1]}</td><td class="r">${a[2]}</td><td>${badge(a[3], a[4])}</td>
          <td class="r">${a[3] === 'bad' ? `<button class="btn btn--sm" data-act="toast:ИИ предложит новый текст — он уйдёт на модерацию только после вашего согласия">${ic('sparkles', 14)}Исправить</button>` : `<button class="btn btn--ghost btn--sm" data-act="toast:Объявление остановлено. Вернуть можно в «Истории»">Остановить</button>`}</td></tr>`).join('')}</table></div>
      <h4>Фразы и ставки</h4>
      <div class="scroll-x"><table class="tbl num"><tr><th>Фраза</th><th class="r">Ставка</th><th class="r">Доля кликов</th><th class="r">Доля заявок</th></tr>
        ${M.campPhrases.map((p, j) => `<tr><td>${p[0]}</td><td class="r"><span class="inp inp--sm"><input data-k="bid${i}-${j}" value="${attr(val(`bid${i}-${j}`, p[1]))}" aria-label="Ставка для «${p[0]}»"><i>₽</i></span></td><td class="r">${Math.round(p[2] * 100)}%</td><td class="r">${Math.round(p[3] * 100)}%</td></tr>`).join('')}</table></div>
      <div class="acc__acts"><button class="btn btn--pri btn--sm" data-act="toast:Ставки сохранены. Запись появилась в «Истории»">Сохранить ставки</button><button class="btn btn--sm" data-act="toast:Вставьте фразы списком — добавим их в эту группу">${ic('plus', 14)}Добавить фразы</button><button class="btn btn--sm" data-act="toast:ИИ напишет вариант объявления и покажет его до отправки">${ic('sparkles', 14)}Новое объявление с ИИ</button></div>
    </div>`
    return `<div class="acc card ${open === i ? 'is-open' : ''}"><button class="acc__head" data-act="set:grp=${open === i ? -1 : i}" aria-expanded="${open === i}">${ic(open === i ? 'down' : 'right', 16)}<b>${g.name}</b>
      <span class="muted num">${g.phrases} ${plural(g.phrases, 'фраза', 'фразы', 'фраз')} · ${g.ads} ${plural(g.ads, 'объявление', 'объявления', 'объявлений')} · ${rub(c.cost * g.share)}</span></button>${body}</div>`
  }).join('')}`
}

function campSettingsTab(c, p) {
  return `<div class="card open pad"><div class="form">
    ${field('cname', 'Название', c.name, { cls: 'field--wide' })}
    ${ddField('Стратегия', dd('cstrat', STRATEGIES, STRATEGIES[0]))}
    ${field('cbud', 'Недельный бюджет', num(budgetOf(c)), { unit: '₽' })}
    ${field('ccpa', c.drr != null ? 'Доля расходов, не выше' : 'Цена заявки, не выше', c.drr != null ? p.target : num(p.target), { unit: c.drr != null ? '%' : '₽' })}
    ${field('creg', 'Регион показа', 'Москва и область')}
    ${ddField('Расписание', dd('csched', SCHEDULES, SCHEDULES[0]))}
    ${field('cneg', 'Минус-фразы кампании', 'вакансии, своими руками, бу, авито, чертёж', { area: true, rows: 2, cls: 'field--wide', hint: 'Общие для всех групп. Минус-фразы из чистки запросов добавляются сюда же.' })}
  </div>
  <div class="form__foot"><button class="btn btn--pri" data-act="toast:Настройки сохранены. Запись появилась в «Истории»">Сохранить</button><small>Изменения сразу уйдут в Директ. Корректировки ставок — в «Отчётах», на вкладке «Площадки».</small></div></div>`
}

function campHeadlinesTab() {
  return `<div class="card pad"><p><b>Масштабирование заголовков.</b> Загрузите отчёт о заголовках из Директа — сервис найдёт те, что приносят заявки, а ИИ соберёт под каждый отдельную копию кампании: одно объявление — один заголовок.</p>
      <p class="muted">Копии создаются черновиками. Каждый шаг ждёт вашего согласования, метки в ссылках ставятся по шаблону проекта.</p></div>
    <h2>Отчёт о заголовках<small>загружен 8 ноября · 3 заголовка</small></h2>
    <div class="card scroll-x"><table class="tbl num"><tr><th>Заголовок</th><th class="r">Показы</th><th class="r">CTR</th><th class="r">Заявки</th><th>Вывод</th></tr>
      ${HEADLINES.map((h) => `<tr><td>${h[0]}</td><td class="r">${num(h[1])}</td><td class="r">${h[2]}</td><td class="r">${h[3]}</td><td>${badge(h[4], h[5])}</td></tr>`).join('')}</table></div>
    <div class="acc__acts"><button class="btn btn--pri" data-act="toast:В рабочем кабинете откроется чат: ИИ предложит шаги, каждый ждёт вашего «Согласовать»">${ic('sparkles', 16)}Масштабировать с ИИ</button><button class="btn" data-act="toast:Откроется выбор файла с отчётом">${ic('upload', 16)}Загрузить другой отчёт</button></div>`
}

function camp() {
  const c = M.campaigns.find((x) => x.id === S.camp && !x.deleted) || M.campaigns[1]
  const p = project(c.project)
  const drr = c.drr != null
  const groups = `<h2>Что внутри<small>группы объявлений и их доля расхода</small></h2>
    <div class="card">${M.campGroups.map((g) => `<div class="gline"><div><b>${g.name}</b><small>${g.phrases} ${plural(g.phrases, 'фраза', 'фразы', 'фраз')} · ${g.ads} ${plural(g.ads, 'объявление', 'объявления', 'объявлений')}</small></div>
      <span class="meter meter--wide" title="${Math.round(g.share * 100)}% расхода"><i style="width:${g.share * 100}%"></i></span><b class="num">${rub(c.cost * g.share)}</b></div>`).join('')}</div>`
  /* Только записи про эту кампанию: чужие изменения в её карточке сбивают с толку. */
  const hist = M.history.filter((h) => h.project === c.project && (h.title.includes(c.name) || h.params.some((x) => x[1] === c.name))).slice(0, 2)
  const recent = `<h2>Недавние изменения<small><button class="lnk" data-act="at:${c.project}=history">Вся история</button></small></h2>
    <div class="card">${hist.length ? hist.map(histLine).join('') : '<p class="pad muted">Эту кампанию давно не меняли.</p>'}</div>`
  const tiles = `<div class="tiles">
    ${tile('Потрачено за 7 дней', rub(c.cost), `${Math.round((c.cost / budgetOf(c)) * 100)}% недельного бюджета`)}
    ${tile(drr ? 'Заказы' : 'Заявки', c.conv, `${num(c.clicks)} ${plural(c.clicks, 'клик', 'клика', 'кликов')}`)}
    ${tile(drr ? 'Доля расходов на рекламу' : 'Цена заявки', campKpi(c), `цель — до ${drr ? `${p.target}%` : rub(p.target)}`)}
    ${pro() ? tile('Конверсия из клика', `${((c.conv / c.clicks) * 100).toFixed(1).replace('.', ',')}%`, 'заявки к кликам') : ''}
  </div>`
  const tab = sub('camp', 'over')
  const body = !pro()
    ? `<p class="lead">${badge(c.health)}<span>${campHealth(c)}.</span></p>${tiles}${campBudget(c)}${groups}${recent}${expertHint('Объявления, фразы, ставки и настройки кампании')}`
    : `${ptabs('camp', [['over', 'Обзор'], ['groups', 'Группы, объявления, фразы'], ['set', 'Настройки'], ['head', 'Заголовки']], 'over')}
      ${tab === 'groups' ? campGroupsTab(c) : tab === 'set' ? campSettingsTab(c, p) : tab === 'head' ? campHeadlinesTab()
        : `${tiles}<h2>${drr ? 'Заказы' : 'Заявки'} по дням</h2><div class="card pad">${barChart({ data: c.spark, labels: daily(7).labels, h: 170, label: 'Конверсии кампании по дням' })}</div>${campBudget(c)}${groups}${recent}`}`
  const menu = `<div class="pop"><button class="iconbtn" data-act="menu:camp" aria-label="Действия с кампанией" title="Действия с кампанией">${ic('more')}</button>
    ${S.menu === 'camp' ? `<div class="menu menu--right"><button data-act="toast:Кампания отправлена на модерацию">${ic('send', 16)}Отправить на модерацию</button><button data-act="toast:Копия создана как черновик — она появится в списке через минуту">${ic('copy', 16)}Создать копию</button>
      <button data-act="camparch">${ic('archive', 16)}В архив</button><hr><button data-act="modal:delcamp">${ic('trash', 16)}Удалить</button></div>` : ''}</div>`
  return `<div class="page" data-scroll="main"><div class="wide">
    <button class="lnk back" data-act="go:camps">${ic('left', 15)}Кампании</button>
    <div class="head"><div><p class="eyebrow">${c.type} · ${p.name}${pro() ? ` · кабинет ${CAB[c.project]}` : ''}</p><h1>${c.name}</h1></div>
      <div class="head__acts">${c.archived ? '<span class="chip">В архиве</span>' : `<span class="swlabel">${campSwitch(c)}<span>${c.on ? 'Идут показы' : 'Остановлена'}</span></span>`}
        <button class="btn btn--pri" data-act="chat:c1">${ic('sparkles', 16)}Разобрать с ИИ</button>${pro() ? menu : ''}</div></div>
    ${body}
  </div></div>`
}

/* ---------- создание вручную ---------- */

  return `<div class="page" data-scroll="main"><div class="wide wide--form">
    <button class="lnk back" data-act="go:camps">${ic('left', 15)}Кампании</button>
    <div class="head"><div><p class="eyebrow">${projectName(S.project)}</p><h1>Новая кампания вручную</h1></div>
      <div class="head__acts"><button class="btn" data-act="chat:c4">${ic('sparkles', 16)}Лучше собрать с ИИ</button></div></div>
    ${sec(1, 'Основное', `${field('wname', 'Название', '', { ph: 'Например: Окна ПВХ — Поиск — Москва', cls: 'field--wide' })}
      <div class="field"><span>Где показывать</span>${segm('wtype', [['search', 'Поиск'], ['net', 'Сети'], ['goods', 'Товары']], 'search')}</div>
      ${S.project ? ddField('Кабинет Директа', `<span class="chip">${CAB[S.project]}</span>`) : ddField('Сайт', dd('wproj', M.projects.map((p) => p.name), M.projects[0].name))}`)}
    ${sec(2, 'Бюджет и стратегия', `${ddField('Стратегия', dd('wstrat', STRATEGIES, STRATEGIES[0]))}${field('wbud', 'Недельный бюджет', '10 000', { unit: '₽' })}${field('wcpa', 'Цена заявки, не выше', '450', { unit: '₽', hint: 'Подставили цель проекта' })}`)}
    ${sec(3, 'Показы', `${field('wreg', 'Регион показа', 'Москва и область')}${ddField('Расписание', dd('wsched', SCHEDULES, SCHEDULES[0]))}`)}
    ${sec(4, 'Ссылки', `${field('wurl', 'Страница сайта', '', { ph: 'https://…', cls: 'field--wide' })}
      <div class="field field--wide"><span>Метки в ссылках</span><p class="muted">Подставятся по шаблону проекта. <button class="lnk" data-act="to:project=utm">Открыть шаблон</button></p></div>`)}
    ${sec(5, 'Первая группа объявлений', `${field('wgrp', 'Название группы', '', { ph: 'Например: Общие запросы' })}${field('wtitle', 'Заголовок объявления', '', { ph: 'До 56 символов' })}
      ${field('wphr', 'Ключевые фразы', '', { area: true, rows: 3, ph: 'Каждая фраза с новой строки', cls: 'field--wide' })}
      ${field('wtext', 'Текст объявления', '', { area: true, rows: 2, ph: 'До 81 символа', cls: 'field--wide' })}
      <div class="field field--wide"><button class="btn btn--sm" data-act="toast:ИИ напишет три варианта по названию и фразам — около 1% месячного лимита">${ic('sparkles', 14)}Написать тексты с ИИ</button></div>`)}
    <div class="form__foot form__foot--page"><button class="btn btn--pri" data-act="toast:Черновик создан в Директе. Запись появилась в «Истории»" data-then="camps">Создать черновик</button><button class="btn" data-act="go:camps">Отмена</button>
      <small>Черновик сам не запустится: на модерацию его отправляете вы.</small></div>
  </div></div>`
}

    title: 'Удалить кампанию?',
    body: `<p>«${(M.campaigns.find((c) => c.id === S.camp) || {}).name}» исчезнет из Директа и из кабинета. Статистика за прошлые дни останется в отчётах.</p><p class="muted">Удаление нельзя вернуть из «Истории».</p>`,
    foot: `<button class="btn btn--danger" data-act="campdel" data-then="camps" data-close>Удалить</button><button class="btn" data-act="close">Отмена</button>`,
  }),
})

Object.assign(ACT, {
  camp: (v) => {
    S.camp = +v
    CAMP_KEYS.forEach((k) => delete S.form[k])
    ACT.go('camp')
  },
  selall: () => {
    const ids = campList().map((c) => c.id)
    const all = ids.every((id) => S.sel.has(id))
    ids.forEach((id) => (all ? S.sel.delete(id) : S.sel.add(id)))
  },
  selnone: () => S.sel.clear(),
  resetf: () => {
    ;['cq', 'cstate', 'ccab'].forEach((k) => delete S.form[k])
    S.flags.noconv = false
  },
  bulk: (v) => {
    const list = M.campaigns.filter((c) => S.sel.has(c.id))
    const word = selWord(list.length)
    if (v === 'start' || v === 'stop') list.filter((c) => c.on !== (v === 'start') && !c.archived).forEach((c) => ACT.toggle(String(c.id)))
    if (v === 'archive') list.forEach((c) => Object.assign(c, { archived: true, on: false, was: c.health === 'off' ? c.was : c.health, health: 'off' }))
    if (v === 'delete') list.forEach((c) => (c.deleted = true))
    S.toast = { start: `Запущено: ${word}`, stop: `Остановлено: ${word}. Вернуть можно в «Истории»`, budget: `Бюджет и стратегия изменены: ${word}. Запись появилась в «Истории»`, copy: `Копии созданы черновиками: ${word}`, archive: `В архиве: ${word}. Найти их можно фильтром «В архиве»`, delete: `Удалено: ${word}` }[v]
    if (v !== 'start' && v !== 'stop') S.sel.clear()
  },
  unarch: (v) => {
    const c = M.campaigns.find((x) => x.id === +v)
    c.archived = false
    S.toast = `«${c.name}» возвращена из архива и остановлена`
  },
  camparch: () => {
    const c = M.campaigns.find((x) => x.id === S.camp)
    Object.assign(c, { archived: true, on: false, was: c.health === 'off' ? c.was : c.health, health: 'off' })
    ACT.go('camps')
    S.toast = `«${c.name}» в архиве`
  },
  campdel: () => {
    const c = M.campaigns.find((x) => x.id === S.camp)
    c.deleted = true
    S.toast = `«${c.name}» удалена`
  },
  editbudget: () => {
    delete S.form.budget
    S.form.bedit = '1'
  },
  savebudget: () => {
    const c = M.campaigns.find((x) => x.id === S.camp)
    const was = budgetOf(c)
    const raw = c.budget
    S.revert = () => (c.budget = raw)
    c.budget = parseInt(String(S.form.budget || '').replace(/\D/g, ''), 10) || was
    S.form.bedit = '0'
    S.toast = c.budget === was ? 'Бюджет не изменился' : `Недельный бюджет: ${rub(was)} → ${rub(c.budget)}. Вернуть можно в «Истории»`
  },
})

/* Запросы: чистка поисковых запросов. Мусор ИИ раскладывает по причинам, человек решает группами. */

/* В каком состоянии разбор у каждого проекта: размечен, новые запросы, пусто, ждёт решения. */
const QSTATE = { okna: 'marked', msk: 'new', dent: 'empty', kofe: 'pending' }
const QWHY = {
  job: 'Люди ищут работу или отзывы сотрудников — покупать окна они не собираются.',
  diy: 'Ищут инструкции и чертежи, чтобы сделать самим. Заявок по таким запросам не было ни разу.',
  brand: 'Ищут сайты конкретных производителей и уходят к ним, а клик оплачиваете вы.',
  free: 'Ищут даром или с рук. Ваши цены им не подойдут — заявок нет.',
}
/* Мусор, который ИИ найдёт в msk.okna-profi.ru после разметки: запрос, клики, расход. */
const QMSK = [['пластиковые окна бу', 9, 210], ['окна вакансии подольск', 6, 150], ['как снять створку окна', 11, 190], ['окна калева личный кабинет', 5, 130], ['чертёж окна пвх', 4, 90]]
const QPERIODS = ['За 7 дней', 'За 30 дней']
const words = (n) => plural(n, 'запрос', 'запроса', 'запросов')
const qCamp = (q) => M.campaigns[+q.id.slice(1) % 2]
const pick = (q) => `<div class="pick"><button class="yes ${verdictOf(q) === 'yes' ? 'on' : ''}" data-act="verdict:${q.id}=yes">Наш</button><button class="no ${verdictOf(q) === 'no' ? 'on' : ''}" data-act="verdict:${q.id}=no">Не наш</button></div>`
const groupAct = (k) => (S.minus.has(k)
  ? `${badge('ok', 'В минус-фразах')}<button class="btn btn--ghost btn--sm" data-act="minus:${k}">${ic('undo', 14)}Вернуть</button>`
  : `<button class="btn btn--sm" data-act="minus:${k}">Минусовать группу</button>`)

/** Запросы под фильтры экспертного режима, в порядке показа. */
function queryRows() {
  const text = val('qq', '').trim().toLowerCase()
  const min = parseInt(String(val('qmin', '')).replace(/\D/g, ''), 10) || 0
  const camp = val('qcamp', 'Все кампании')
  const ok = (q) => (!text || q.q.includes(text)) && q.cost >= min && (!on('qnoconv') || !q.conv) && (camp === 'Все кампании' || qCamp(q).name === camp)
  const order = (q) => (q.r ? Object.keys(M.reasons).indexOf(q.r) : q.v === 'maybe' ? 10 : 11)
  return M.queries.filter(ok).sort((a, b) => order(a) - order(b))
}

/* ---------- разбор ---------- */

function triageSummary() {
  const t = M.queryTotals
  const keys = Object.keys(M.reasons)
  const left = keys.filter((k) => !S.minus.has(k))
  const leftCount = sum(left.map((k) => M.reasons[k].count))
  const leftCost = sum(left.map((k) => M.reasons[k].cost))
  return `<div class="summary card">${ic('sparkles', 20)}<p>${left.length
    ? `ИИ просмотрел <b>${t.all} ${words(t.all)}</b> и разложил мусорные по причинам. Осталось разобрать <b>${leftCount} ${words(leftCount)} на ${rub(leftCost)}</b> за неделю.`
    : `Готово: ${t.no} мусорных ${words(t.no)} добавлены в минус-фразы. Экономия — около <b>${rub(t.noCost)} в неделю</b>.`}</p>
    ${left.length ? `<button class="btn btn--pri" data-act="minusall">Минусовать ${left.length === keys.length ? 'все ' : ''}${left.length} ${plural(left.length, 'группу', 'группы', 'групп')}</button>` : `<button class="btn" data-act="minusnone">${ic('undo', 15)}Вернуть</button>`}</div>`
}

function triageSimple() {
  const t = M.queryTotals
  const stats = (q) => `${q.clicks} ${plural(q.clicks, 'клик', 'клика', 'кликов')} · ${rub(q.cost)}${q.conv ? ` · ${q.conv} ${plural(q.conv, 'заявка', 'заявки', 'заявок')}` : ''}`
  return `${triageSummary()}<div class="rgrid">${Object.keys(M.reasons).map((k) => {
      const r = M.reasons[k]
      const qs = M.queries.filter((q) => q.r === k)
      const why = val('qwhy', '') === k
      return `<article class="rcard card ${S.minus.has(k) ? 'is-done' : ''}"><header><h3>${r.label}</h3><span class="num">${r.count} ${words(r.count)} · ${rub(r.cost)}</span></header>
        <ul>${qs.map((q) => `<li>${q.q}<span class="num">${rub(q.cost)}</span></li>`).join('')}${r.count > qs.length ? `<li class="muted">и ещё ${r.count - qs.length}</li>` : ''}</ul>
        ${why ? `<p class="why">${ic('sparkles', 15)}<span>${QWHY[k]}</span></p>` : ''}
        <footer>${groupAct(k)}${S.minus.has(k) ? '' : `<button class="btn btn--ghost btn--sm" data-act="set:qwhy=${why ? '' : k}" aria-expanded="${why}">Почему это мусор?</button>`}</footer></article>`
    }).join('')}</div>
    <h2>ИИ не уверен — решите сами <span>${t.maybe}</span></h2>
    <div class="card">${M.queries.filter((q) => q.v === 'maybe').map((q) => `<div class="qrow"><div><b>${q.q}</b><small>${q.why}</small></div><span class="num muted">${stats(q)}</span>${pick(q)}</div>`).join('')}</div>
    <div class="okrow card">${badge('ok', `${t.yes} полезных ${words(t.yes)}`)}<span>С ними всё в порядке, делать ничего не нужно.</span><button class="btn btn--ghost btn--sm" data-act="flag:qyes" aria-expanded="${on('qyes')}">${on('qyes') ? 'Скрыть' : 'Показать'}${ic(on('qyes') ? 'up' : 'down', 15)}</button></div>
    ${on('qyes') ? `<div class="card">${M.queries.filter((q) => q.v === 'yes').map((q) => `<div class="qrow"><div><b>${q.q}</b></div><span class="num muted">${stats(q)}</span></div>`).join('')}<p class="pad muted">и ещё ${t.yes - 3} — у них есть заявки или клики по делу.</p></div>` : ''}
    ${expertHint('Фильтры, таблица всех запросов, память решений и общие списки минус-фраз')}`
}

function triageExpert() {
  const t = M.queryTotals
  const rows = queryRows()
  const row = (q) => `<tr class="${S.qcur === q.id ? 'is-cur' : ''}"><td>${q.q}${q.why ? `<small>${q.why}</small>` : ''}</td><td class="muted md">${qCamp(q).name}</td><td class="r md">${q.clicks}</td><td class="r">${rub(q.cost)}</td><td class="r">${q.conv || '—'}</td><td class="r">${pick(q)}</td></tr>`
  const grp = (title, list, act) => (list.length ? `<tr class="grp"><td colspan="3">${title}</td><td class="md" colspan="2"></td><td class="r">${act ? `<div class="grp__act">${act}</div>` : ''}</td></tr>${list.map(row).join('')}` : '')
  const body = rows.length
    ? `<div class="card scroll-x"><table class="tbl num"><tr><th>Запрос</th><th class="md">Кампания</th><th class="r md">Клики</th><th class="r">Расход</th><th class="r">Заявки</th><th class="r">Решение</th></tr>
        ${Object.keys(M.reasons).map((k) => grp(`<b>${M.reasons[k].label}</b> · ${M.reasons[k].count} ${words(M.reasons[k].count)} · ${rub(M.reasons[k].cost)}`, rows.filter((q) => q.r === k), groupAct(k))).join('')}
        ${grp(`<b>ИИ не уверен</b> · ${t.maybe} ${words(t.maybe)}`, rows.filter((q) => q.v === 'maybe'))}
        ${grp(`<b>Полезные</b> · ${t.yes} ${words(t.yes)}`, rows.filter((q) => q.v === 'yes'))}
      </table></div>`
    : `<div class="card empty empty--sm">${ic('search', 24)}<p>Под эти условия запросов нет.</p><div><button class="btn" data-act="qreset">Сбросить фильтры</button></div></div>`
  return `${triageSummary()}
    <div class="fbar">${search('qq', 'Найти запрос')}${dd('qcamp', ['Все кампании', M.campaigns[0].name, M.campaigns[1].name], 'Все кампании')}
      <label class="field field--row"><span>Расход от</span><span class="inp"><input data-k="qmin" data-live value="${attr(val('qmin', ''))}" placeholder="0" style="width:56px"><i>₽</i></span></label>
      ${chipFlag('qnoconv', 'Без конверсий')}</div>
    ${body}
    <div class="card open pad applybar">
      <div><b>Мусорные — в минус-фразы</b><span class="muted">Куда добавлять:</span>${dd('qlevel', ['В кампанию', 'В группу объявлений', 'В общий список'], 'В кампанию')}</div>
      <div><b>Полезные — в ключевые фразы</b>${field('qbid', 'Ставка для новых фраз', '45', { unit: '₽', w: 56, cls: 'field--row' })}<button class="btn btn--sm" data-act="toast:Запросы с решением «Наш» добавлены как фразы. Запись появилась в «Истории»">${ic('plus', 14)}Добавить «наши» как фразы</button></div>
    </div>
    <p class="meta">С клавиатуры: ↑ и ↓ — выбрать запрос, 1 — «наш», 2 — «не наш».</p>`
}

/* ---------- состояния проектов без готового разбора ---------- */

function queriesNew(p) {
  if (!S.marked[p.id]) return `<div class="card empty">${ic('filter', 30)}<h2>36 новых запросов за неделю</h2>
    <p>ИИ ещё не смотрел их. Он разложит запросы на «наши» и мусор и объяснит почему — вам останется решить группами.</p>
    <div><button class="btn btn--pri" data-act="mark:${p.id}">${ic('sparkles', 16)}Разметить с ИИ</button></div><small class="muted">Разметка потратит около 1% месячного лимита</small></div>`
  const done = on('qmsk')
  return `<div class="summary card">${ic('sparkles', 20)}<p>${done ? 'Готово: 7 минус-фраз добавлены. Экономия — около <b>890 ₽ в неделю</b>.' : 'ИИ просмотрел <b>36 запросов</b>: 7 похожи на мусор — на них ушло <b>890 ₽</b> за неделю. Остальные 29 — ваши.'}</p>
      ${done ? `<button class="btn" data-act="flag:qmsk">${ic('undo', 15)}Вернуть</button>` : `<button class="btn btn--pri" data-act="flag:qmsk">Добавить 7 минус-фраз</button>`}</div>
    <div class="card scroll-x"><table class="tbl num ${done ? 'is-struck' : ''}"><tr><th>Запрос</th><th class="r">Клики</th><th class="r">Расход</th><th class="r">Заявки</th></tr>
      ${QMSK.map((q) => `<tr><td>${q[0]}</td><td class="r">${q[1]}</td><td class="r">${rub(q[2])}</td><td class="r">—</td></tr>`).join('')}
      <tr><td class="muted">и ещё 2 запроса</td><td class="r">5</td><td class="r">${rub(120)}</td><td class="r">—</td></tr></table></div>`
}

function queriesPending() {
  const st = S.decided.t5
  if (st === 'done') return `<div class="card empty">${ic('check', 30)}<h2>Запросы разобраны</h2><p>9 минус-фраз добавлены в кампании. Новые запросы появятся после следующего обновления из Директа.</p><div><button class="btn" data-act="go:history">Открыть историю</button></div></div>`
  if (st === 'rejected') return `<div class="card empty">${ic('filter', 30)}<h2>Предложение отклонено</h2><p>9 запросов остались без решения. Можно разобрать их заново или вернуть предложение ИИ.</p><div><button class="btn btn--pri" data-act="undo:t5">${ic('undo', 16)}Вернуть предложение</button></div></div>`
  return `<div class="card empty">${ic('sparkles', 30)}<h2>ИИ уже разобрал запросы и ждёт вашего решения</h2>

    <div><button class="btn btn--pri" data-act="done:t5">Добавить 9 минус-фраз</button><button class="btn" data-act="chat:c3">Посмотреть в чате</button></div></div>`

/** Без выбранного проекта — очередь: где есть что разбирать. */
function queriesQueue() {
  const t = M.queryTotals
  const line = {
    okna: allMinus() ? ['ok', 'Мусорные запросы в минус-фразах', 'Посмотреть'] : ['warn', `${t.all} новых ${words(t.all)}, ${t.no} похожи на мусор · ${rub(t.noCost)} за неделю`, 'Разобрать'],
    msk: on('qmsk') ? ['ok', '7 минус-фраз добавлены', 'Посмотреть'] : ['warn', S.marked.msk ? '7 мусорных запросов на 890 ₽ — ждут решения' : '36 новых запросов, ИИ ещё не размечал', 'Открыть'],

  }).join('')}</div>
  <p class="meta">Новые запросы сервис забирает из Директа каждое утро. Размечает их ИИ — только когда вы нажмёте кнопку.</p>`
}

/* ---------- память решений и списки минус-фраз (экспертный режим) ---------- */

function queriesMemory() {
  if (!S.project) return needProject('Решения по запросам')
  return `<div class="card pad"><p><b>Сервис помнит ваши решения.</b> Запрос, который вы назвали своим, больше не попадёт в мусор, а отклонённый — не вернётся в разбор. ИИ учитывает эту память при каждой разметке.</p></div>
    <div class="card scroll-x"><table class="tbl num"><tr><th>Запрос</th><th>Решение</th><th>Когда</th><th></th></tr>
      ${M.memory.map((m, i) => `<tr><td>${on(`forget:${i}`) ? `<s>${m[0]}</s>` : m[0]}</td><td>${m[1] === 'Наш' ? badge('ok', 'Наш') : `<span class="st st--off">${ic('x', 13)}Не наш</span>`}</td><td class="muted">${m[2]}</td>
        <td class="r"><button class="btn btn--ghost btn--sm" data-act="flag:forget:${i}">${on(`forget:${i}`) ? `${ic('undo', 14)}Вернуть` : 'Забыть'}</button></td></tr>`).join('')}</table></div>
    ${S.project === 'okna' ? '' : '<p class="meta">В макете показана память проекта okna-profi.ru.</p>'}`
}

function queriesLists() {
  const prev = val('mlprev', '')
  return `<div class="card pad"><p><b>Общие списки минус-фраз</b> подключаются сразу к нескольким кампаниям. Добавили фразу в список — она применилась везде, где он подключён.</p></div>
    ${M.minusLists.map((l, i) => `<div class="card pad mlist"><div class="between"><div><b>${l.name}</b><p class="muted">${l.count} ${plural(l.count, 'фраза', 'фразы', 'фраз')} · подключён к ${l.camps} ${plural(l.camps, 'кампании', 'кампаниям', 'кампаниям')}</p></div>
        <div class="acts acts--tight"><button class="btn btn--sm" data-act="set:mlprev=${prev === String(i) ? '' : i}" aria-expanded="${prev === String(i)}">Обновить из разбора</button><button class="btn btn--ghost btn--sm" data-act="toast:Список откроется для правки: фразы можно добавить или убрать вручную">${ic('edit', 14)}Изменить</button></div></div>
      ${prev === String(i) ? `<div class="effect num"><div><small>Добавим</small><b>${6 - i * 2} ${plural(6 - i * 2, 'фразу', 'фразы', 'фраз')}</b></div><div><small>Уберём</small><b>0</b></div><div><small>Пропустим</small><b>${2 + i} — уже есть</b></div></div>
        <div class="acts acts--tight"><button class="btn btn--pri btn--sm" data-act="toast:Список обновлён и применён к кампаниям. Запись появилась в «Истории»">Применить</button><button class="btn btn--sm" data-act="set:mlprev=">Отмена</button></div>` : ''}</div>`).join('')}
    <div class="acts"><button class="btn" data-act="toast:Назовите список и выберите кампании — фразы добавите следующим шагом">${ic('plus', 16)}Создать список</button></div>`
}

function queries() {
  const p = S.project && project(S.project)
  const tab = pro() ? sub('queries', 'triage') : 'triage'
  const st = p && QSTATE[p.id]
  let body
  if (tab === 'memory') body = queriesMemory()
  else if (tab === 'lists') body = queriesLists()
  else if (!p) body = queriesQueue()
  else if (st === 'marked') body = pro() ? triageExpert() : triageSimple()
  else if (st === 'new') body = queriesNew(p)
  else if (st === 'pending') body = queriesPending()
  else body = `<div class="card empty">${ic('check', 30)}<h2>Новых запросов нет</h2><p>Все запросы за неделю уже разобраны 6 ноября. Следующая загрузка из Директа — завтра утром.</p></div>`
  return `<div class="page" data-scroll="main"><div class="wide">
    <div class="head"><div><p class="eyebrow">${projectName(S.project)} · новые поисковые запросы</p><h1>${p ? 'Чистка запросов' : 'Запросы'}</h1></div>
      <div class="head__acts">${dd('qper', QPERIODS, QPERIODS[0])}<button class="btn" data-act="toast:Запросы обновлены из Директа: новых нет">${ic('refresh', 16)}Обновить из Директа</button></div></div>
    ${pro() ? ptabs('queries', [['triage', 'Разбор'], ['memory', 'Память решений'], ['lists', 'Списки минус-фраз']], 'triage') : ''}

/** Клавиатура в таблице разбора: стрелки выбирают запрос, 1 и 2 ставят решение. */
function onKey(e) {
  if (S.screen !== 'queries' || !pro() || S.project !== 'okna' || sub('queries', 'triage') !== 'triage' || S.modal) return false
  if (/^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) return false
  const rows = queryRows()
  const i = rows.findIndex((q) => q.id === S.qcur)
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!rows.length) return false
    S.qcur = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))].id
  } else if ((e.key === '1' || e.key === '2') && i >= 0) S.verdicts[S.qcur] = e.key === '1' ? 'yes' : 'no'
  else return false
  e.preventDefault()
  return true
}

/* История: всё, что меняли в Директе — человек, ИИ с согласия и правила. Любое изменение можно вернуть. */

/* Как выполненное предложение или сигнал называется в истории. */
const TASK_HIST = {
  t3: 'Снижены ставки в 3 группах на 15%',
  t4: 'Исключены 14 площадок РСЯ без заявок',
  t5: 'Добавлены 9 минус-фраз',
  t6: 'Остановлена кампания «Окна ПВХ — РСЯ»',
  t7: '2 объявления исправлены и отправлены на модерацию',
}
const HPERIODS = ['За 7 дней', 'За 30 дней', 'За всё время']
const HSRC = [['all', 'Все'], ['ai', 'ИИ'], ['user', 'Вы'], ['rule', 'Правила']]

/** Записи истории: готовые из данных и то, что человек сделал в макете сам. */
function historyEntries() {
  const now = { day: 'Сегодня', time: 'только что' }
  const out = S.log.map((l) => ({ ...now, id: `l:${l.id}`, who: 'user', project: l.project, title: l.title, params: [['Где', l.project ? project(l.project).name : 'Все проекты']], result: 'Директ принял изменение', undo: 'Вернём то, что было до этого изменения. Директ получит прежние значения сразу.' }))
  M.tasks.filter((t) => S.decided[t.id] === 'done' && TASK_HIST[t.id]).forEach((t) => out.push({
    ...now, id: `t:${t.id}`, who: t.group === 'ai' ? 'ai' : 'user', project: t.project, title: TASK_HIST[t.id],
    params: t.diff ? t.diff.map((d) => [d[0], `${d[1]} → ${d[2]}`]) : [['Основание', t.text]],
    result: 'Директ принял изменение', undo: 'Вернём то, что было до этого изменения. Директ получит прежние значения сразу.',
  }))
  Object.keys(M.reasons).filter((k) => S.minus.has(k)).forEach((k) => {
    const r = M.reasons[k]
    out.push({ ...now, id: `m:${k}`, who: 'user', project: 'okna', title: `Добавлены минус-фразы: «${r.label}», ${r.count} ${words(r.count)}`, params: [['Группа запросов', r.label], ['Расход за неделю', rub(r.cost)], ['Уровень', 'кампания']], result: `Директ принял все фразы: ${r.count}`, undo: `Уберём эти минус-фразы. Объявления снова смогут показываться по ${r.count} ${plural(r.count, 'запросу', 'запросам', 'запросам')}.` })
  })
  M.campaigns.filter((c) => c.was && !c.on && !c.deleted && !c.archived).forEach((c) => out.push({ ...now, id: `c:${c.id}`, who: 'user', project: c.project, title: `Остановлена кампания «${c.name}»`, params: [['Кампания', c.name]], result: 'Показы остановлены', undo: 'Запустим кампанию снова.' }))
  S.gone.forEach((g) => out.push(g))
  M.history.forEach((h) => out.push({ ...h, id: `h:${h.id}` }))
  return out
}

  const all = historyEntries().filter((e) => !S.project || e.project === S.project || !e.project)

    ${pro() ? `<div class="fbar">${segm('hsrc', HSRC, 'all')}<span class="muted">${list.length} ${plural(list.length, 'запись', 'записи', 'записей')}</span></div>` : ''}
    ${days.map((d) => `<h2>${d}</h2><div class="card">${list.filter((e) => e.day === d).map(hrow).join('')}</div>`).join('')}
    ${list.length ? '' : `<div class="card empty empty--sm">${ic('history', 24)}<p>${all.length ? 'Под этот фильтр записей нет.' : 'В этом проекте ещё ничего не меняли.'}</p>${all.length ? '<div><button class="btn btn--sm" data-act="hreset">Показать все</button></div>' : ''}</div>`}
    ${expertHint('Кто сделал изменение, с какими параметрами и что ответил Директ')}
  </div></div>`
}

/** Действие с пометкой про «Историю» оставляет в ней запись. Вызывается после каждого клика. */
function noteHistory(name, arg, flagsBefore) {
  const t = S.toast
  if (!t || !t.includes('Истори')) return
  /* У этих действий своя запись: её собирает historyEntries из состояния. */
  if (['done', 'toggle', 'minusall', 'undoh'].includes(name) || (name === 'bulk' && (arg === 'stop' || arg === 'start'))) return
  const changed = Object.keys(S.flags).filter((k) => S.flags[k] !== flagsBefore[k])
  const own = S.revert
  const c = S.screen === 'camp' && M.campaigns.find((x) => x.id === S.camp)
  S.log.unshift({
    id: String(S.log.length + 1),
    title: t.replace(/[.:]?\s*(Вернуть( как было)? можно|Запись появилась) в «Истории».*$/, ''),
    project: c ? c.project : S.project,
    revert: () => {
      changed.forEach((k) => (S.flags[k] = flagsBefore[k]))
      if (own) own()
    },
  })
}

Object.assign(MODALS, {
  undo: (id) => {
    const e = historyEntries().find((x) => x.id === id)
    if (!e) return { title: 'Запись не найдена', body: '<p>Похоже, это изменение уже вернули.</p>', foot: '<button class="btn" data-act="close">Закрыть</button>' }
    return {
      title: 'Вернуть как было?',
      body: `<p><b>${e.title}</b></p><p>${e.undo}</p><p class="muted">Возврат тоже попадёт в историю. Статистика за прошедшие дни не изменится.</p>`,
      foot: `<button class="btn btn--pri" data-act="undoh:${id}" data-close>Вернуть</button><button class="btn" data-act="close">Отмена</button>`,
    }
  },
})

Object.assign(ACT, {
  undoh: (id) => {
    const e = historyEntries().find((x) => x.id === id)
    if (!e) return
    const i = id.indexOf(':')
    const kind = id.slice(0, i)
    const key = id.slice(i + 1)
    if (kind === 'h' || kind === 'l') {
      S.flags[`undone:${id}`] = true
      const l = kind === 'l' && S.log.find((x) => x.id === key)
      if (l) l.revert()
    } else {
      /* Запись собрана из состояния: сохраняем её снимок и возвращаем само состояние. */
      S.gone.unshift({ ...e, id: `g:${S.gone.length + 1}`, undone: true })
      if (kind === 't') delete S.decided[key]
      if (kind === 'm') S.minus.delete(key)
      if (kind === 'c') ACT.toggle(key)
    }
    S.toast = 'Возвращено как было'
  },
  hreset: () => {
    delete S.form.hsrc
    delete S.form.hper
  },
})

/** Боковые вкладки настроек. Экспертная вкладка в обычном режиме не видна — открывается первая. */
function snav(k, list) {
  const shown = list.filter((t) => pro() || !t[3])
  const cur = shown.some((t) => t[0] === sub(k, '')) ? sub(k, '') : shown[0][0]
  return { cur, html: `<nav class="snav">${shown.map(([id, icon, label]) => `<button class="${cur === id ? 'active' : ''}" data-act="sub:${k}=${id}">${ic(icon, 16)}<span>${label}</span></button>`).join('')}</nav>` }
}
const sec = (title, text, body, cls = '') => `<section class="sec card open pad ${cls}"><h3>${title}</h3>${text ? `<p class="muted">${text}</p>` : ''}${body}</section>`
const saveBar = (text = 'Настройки сохранены') => `<div class="form__foot"><button class="btn btn--pri" data-act="toast:${text}">Сохранить</button></div>`
/** Строка списка: название с пояснением слева, действия справа. */
const lrow = (title, text, acts, icon = '') => `<div class="lrow">${icon ? `<i class="lrow__ic">${ic(icon, 16)}</i>` : ''}<div><b>${title}</b>${text ? `<small>${text}</small>` : ''}</div><div class="lrow__acts">${acts}</div></div>`
/** Выключатель, который включён по умолчанию: флаг хранит «выключено». */
const offRow = (flag, title, text) => `<div class="trow"><div><b>${title}</b>${text ? `<p>${text}</p>` : ''}</div>${swBtn(`flag:${flag}`, !on(flag), title)}</div>`
const delBtn = (flag, label) => `<button class="iconbtn" data-act="flag:${flag}" aria-label="${attr(label)}" title="${attr(label)}">${ic('trash', 16)}</button>`

/* ---------- настройки проекта ---------- */

function psMain(p) {
  const k = (x) => `${p.id}.${x}`
  const kind = val(k('kpi'), isDrr(p) ? 'drr' : 'cpa')
  const same = kind === (isDrr(p) ? 'drr' : 'cpa')
  return `${sec('Цель рекламы', 'По этой цели сервис решает, что работает хорошо, а что требует внимания.', `<div class="form">
      ${ddField('Что считаем результатом', segm(k('kpi'), [['cpa', 'Заявки'], ['drr', 'Заказы магазина']], isDrr(p) ? 'drr' : 'cpa'), kind === 'drr' ? 'Следим за долей расходов на рекламу в выручке.' : 'Следим за ценой одной заявки.')}
      ${field(k(`target-${kind}`), kind === 'drr' ? 'Доля расходов на рекламу — не выше' : 'Цена заявки — не выше', same ? num(p.target) : '', { unit: kind === 'drr' ? '%' : '₽', w: 90, ph: 'Не задана' })}
      ${field(k('budget'), 'Бюджет на месяц', num(p.budget), { unit: '₽', w: 110, hint: 'Сервис предупредит, если деньги уходят быстрее плана.' })}
    </div>`)}
    ${sec('Что считать заявкой', 'Цели из Метрики. Отмеченные идут в «заявки» во всём кабинете.', `<div class="card">${GOALS.map((g, i) => `<div class="trow"><div><b>${g[0]}</b><p>${g[1]}</p></div>${swBtn(`flag:goal:${p.id}:${i}`, i < 2 !== on(`goal:${p.id}:${i}`), g[0])}</div>`).join('')}</div>`)}
    ${saveBar('Настройки проекта сохранены')}
    ${pro() ? sec('Отключить сайт', 'Сервис перестанет загружать данные и считать сигналы. Кампании в Директе продолжат работать как сейчас.', `<div class="acts acts--tight"><button class="btn btn--danger btn--sm" data-act="toast:В макете сайт отключить нельзя">Отключить ${p.name}</button></div>`) : ''}`
}

  return `${sec('О бизнесе', 'ИИ читает это перед каждым ответом — чем точнее, тем меньше придётся поправлять.', `<div class="form form--one">
      ${field(k('about'), 'Что вы продаёте и кому', BIZ[p.id], { area: true, rows: 3 })}
      ${field(k('usp'), 'Чем вы лучше других', '', { area: true, rows: 2, ph: 'Например: своё производство, гарантия 5 лет, оплата после монтажа' })}
      ${field(k('stop'), 'О чём не писать и что не предлагать', '', { area: true, rows: 2, ph: 'Например: не обещать скидки, не упоминать рассрочку' })}
    </div>`)}
    ${sec('Файлы для ИИ', 'Прайс, сценарий звонка, описание акций. ИИ заглядывает в них, когда пишет объявления и отвечает на вопросы.', `<div class="card">${files.length
      ? files.map(([f, i]) => lrow(f[0], f[1], delBtn(`filedel:${i}`, `Удалить файл ${f[0]}`), 'file')).join('')
      : '<p class="pad muted">Файлов пока нет.</p>'}</div>
      <div class="acts acts--tight"><button class="btn btn--sm" data-act="toast:В рабочем кабинете откроется выбор файла: PDF, DOCX или TXT до 10 МБ">${ic('upload', 14)}Загрузить файл</button></div>`)}
    ${saveBar('Описание бизнеса сохранено')}`
}

      ${ddField('Тон', segm(k('tone'), [['calm', 'Спокойный'], ['sell', 'Продающий'], ['expert', 'Экспертный']], 'calm'))}

    ${sec('ИИ ничего не меняет сам', 'Каждое изменение ждёт вашего «Выполнить». Всё выполненное можно вернуть в «Истории».', `<div class="acts acts--tight"><button class="btn btn--sm" data-act="go:history">${ic('history', 14)}Открыть историю</button></div>`)}

      ${toggleRow(`acc:minus:${p.id}`, 'Добавлять минус-фразы', 'Только запросы без единой заявки за 30 дней')}

function psCabs(p) {
  const list = M.campaigns.filter((c) => c.project === p.id && !c.deleted)
  return sec('Кабинеты и кампании проекта', 'Сервис сам подбирает кампании по адресу сайта в объявлениях. Здесь можно поправить вручную.', `
    <p class="lead"><span class="chip">${ic('megaphone', 14)}Кабинет Директа: ${CAB[p.id]}</span></p>
    <div class="card scroll-x"><table class="tbl"><tr><th>Кампания</th><th>Тип</th><th class="r">Считать в проекте</th></tr>
      ${list.map((c) => `<tr><td><b>${c.name}</b></td><td>${c.type}</td><td class="r">${swBtn(`flag:campout:${c.id}`, !on(`campout:${c.id}`), `Считать «${c.name}» в проекте`)}</td></tr>`).join('')}</table></div>

function psUtm(p) {
  const rows = p.id === 'okna' ? M.linkCheck : M.campaigns.filter((c) => c.project === p.id && !c.deleted).map((c) => [c.name, true])
  return `${sec('Шаблон ссылки', 'Метки для Метрики и вашей CRM. Шаблон записывается в параметры отслеживания кампании — сами ссылки в объявлениях не меняются.', `<div class="form form--one">${field(`${p.id}.utm`, 'Параметры', UTM, { area: true, rows: 2, hint: 'Подставятся сами: {campaign_id}, {ad_id}, {keyword}.' })}</div>
    <div class="acts acts--tight"><button class="btn btn--pri btn--sm" data-act="toast:Шаблон сохранён. Новые кампании получат его сразу">Сохранить шаблон</button></div>`)}
    ${sec('Проверка кампаний', 'У каких кампаний параметры совпадают с шаблоном.', `<div class="card">${rows.map((r, i) => {
      const ok = r[1] || on(`utmfix:${p.id}:${i}`)
      return lrow(r[0], '', ok ? badge('ok', 'По шаблону') : `${badge('warn', 'Свои метки')}<button class="btn btn--sm" data-act="utmfix:${p.id}:${i}">Привести к шаблону</button>`)
    }).join('')}</div>`)}`
}

function psClient(p) {
  const clients = [...new Set(M.projects.map((x) => x.client).filter(Boolean)), 'Без клиента']
  return sec('Клиент', 'Клиент — это папка над проектами. Удобно, если ведёте несколько бизнесов или работаете как агентство.', `<div class="form">
      ${ddField('Папка клиента', dd(`${p.id}.client`, clients, p.client || 'Без клиента'))}
      ${field('clientnew', 'Или новая папка', '', { ph: 'Название клиента' })}
    </div>${saveBar('Проект перенесён в папку клиента')}`)
}

function projectSettings() {
  const p = S.project && project(S.project)
  if (!p) {
    return `<div class="page" data-scroll="main"><div class="wide">
      <div class="head"><div><p class="eyebrow">Все проекты</p><h1>Настройки проекта</h1></div></div>
      <div class="card empty empty--sm">${ic('folder', 24)}<p>У каждого сайта свои цель, бюджет и описание бизнеса. Выберите сайт.</p><div>${M.projects.map((x) => `<button class="btn btn--sm" data-act="project:${x.id}">${x.name}</button>`).join('')}</div></div>
    </div></div>`
  }
  const nav = snav('project', PTABS)
  const body = { main: psMain, biz: psBiz, ai: psAi, access: psAccess, mem: psMem, cabs: psCabs, utm: psUtm, client: psClient }[nav.cur](p)
  return `<div class="page" data-scroll="main"><div class="wide">
    <div class="head"><div><p class="eyebrow">${p.name}${pro() && p.client ? ` · ${p.client}` : ''}</p><h1>Настройки проекта</h1></div></div>
    <div class="set">${nav.html}<div class="set__body">${body}${expertHint('Права ИИ, память помощника, кабинеты, шаблон ссылки и папка клиента')}</div></div>
  </div></div>`
}

/* ---------- подключения ---------- */

function connect() {
  const max = 5
  const free = M.counters.filter((c) => !c[2])
  const count = M.projects.length
  const addBox = on('addsite') ? `<div class="card open pad"><h3 class="cap">Какой сайт добавить?</h3>
    <p class="muted">Это счётчики Метрики из вашего аккаунта Яндекса, которые ещё не подключены. На тарифе «${M.plan.name}» можно ещё ${max - count}.</p>
    <div class="card">${free.map((c) => lrow(c[0], `счётчик ${c[1]}`, `<button class="btn btn--sm" data-act="toast:${c[0]} добавлен. Загружаем кампании и статистику — обычно это занимает около минуты" data-then="connect">Добавить</button>`)).join('')}</div>
    <div class="acts acts--tight"><button class="btn btn--ghost btn--sm" data-act="flag:addsite">Отмена</button></div></div>` : ''
  const expert = `<h2>Счётчики Метрики <span>${M.counters.length}</span></h2>
    <div class="card scroll-x"><table class="tbl"><tr><th>Сайт</th><th>Счётчик</th><th>Проект</th><th></th></tr>
      ${M.counters.map((c) => `<tr><td><b>${c[0]}</b></td><td class="num">${c[1]}</td><td>${c[2] ? badge('ok', 'Подключён') : '<span class="muted">Не подключён</span>'}</td><td class="r">${c[2] ? `<button class="btn btn--ghost btn--sm" data-act="at:${c[2]}=project">Настройки</button>` : `<button class="btn btn--sm" data-act="toast:${c[0]} добавлен. Загружаем кампании и статистику — обычно это занимает около минуты">Добавить</button>`}</td></tr>`).join('')}</table></div>
    <h2>Кабинеты Директа <span>${M.cabinets.length}</span><small>за 7 дней</small></h2>
    <div class="card scroll-x"><table class="tbl num"><tr><th>Логин</th><th class="r">Кампании</th><th class="r">Баланс</th><th class="r">Расход</th><th class="r">Конверсии</th></tr>
      ${M.cabinets.map((c) => `<tr><td><b>${c.login}</b></td><td class="r">${c.camps}</td><td class="r">${rub(c.balance)}</td><td class="r">${rub(c.cost)}</td><td class="r">${c.conv}</td></tr>`).join('')}</table></div>
    <div class="acts acts--tight"><button class="btn btn--sm" data-act="toast:В рабочем кабинете откроется вход в Яндекс под другим логином">${ic('plus', 14)}Добавить кабинет</button></div>
    <h2>Яндекс Аудитории</h2>
    <div class="card">${lrow('Аудитории', 'Нужны, чтобы показывать рекламу похожим на ваших клиентов и не показывать тем, кто уже купил. Подключаются отдельным разрешением Яндекса.',
      on('audoff') ? `<span class="muted">Не подключены</span><button class="btn btn--sm" data-act="flag:audoff">Подключить</button>` : `${badge('ok', 'Подключены')}<button class="btn btn--ghost btn--sm" data-act="flag:audoff">Отключить</button>`, 'user')}</div>
    <h2>История обновлений</h2>
    <div class="card scroll-x"><table class="tbl"><tr><th>Когда</th><th>Что загружали</th><th>Результат</th></tr>
      ${M.syncs.map((s) => `<tr><td class="num">${s[0]}</td><td>${s[1]}</td><td>${badge('ok', s[2])}</td></tr>`).join('')}</table></div>
    <div class="acts acts--tight"><button class="btn btn--sm" data-act="toast:Полная загрузка запущена: обычно занимает 5–7 минут. Работать можно как обычно">${ic('refresh', 14)}Загрузить всё заново</button></div>`
  return `<div class="page" data-scroll="main"><div class="wide wide--form">
    <div class="head"><div><p class="eyebrow">Откуда сервис берёт данные</p><h1>Подключения</h1></div></div>
    <div class="card">${lrow(`Яндекс: ${M.user.yandex}`, 'Доступ к Директу и Метрике. Сервис читает статистику, а менять рекламу может только после вашего «Выполнить».',
      `${badge('ok', 'Подключён')}<button class="btn btn--ghost btn--sm" data-act="toast:В рабочем кабинете откроется вход в Яндекс">Переподключить</button>`, 'plug')}
      ${lrow('Данные обновлены 10 минут назад', 'Обновляются сами каждые полчаса. Поисковые запросы — раз в сутки.', `<button class="btn btn--sm" data-act="toast:Обновляем данные — обычно это занимает около минуты">${ic('refresh', 14)}Обновить сейчас</button>`, 'refresh')}</div>
    <h2>Сайты <span>${count}</span><small>тариф «${M.plan.name}»: ${count} из ${max}</small></h2>
    <div class="card">${M.projects.map((p) => lrow(`<span class="dot dot--${p.status}"></span>${p.name}`, `${pro() ? `счётчик ${(M.counters.find((c) => c[2] === p.id) || [])[1]} · ` : ''}${p.camps} ${plural(p.camps, 'кампания', 'кампании', 'кампаний')}${p.client ? ` · ${p.client}` : ''}`,
      `<button class="btn btn--ghost btn--sm" data-act="at:${p.id}=project">${ic('gear', 14)}Настройки</button>`)).join('')}</div>
    ${addBox || `<div class="acts acts--tight"><button class="btn btn--sm" data-act="flag:addsite">${ic('plus', 14)}Добавить сайт</button></div>`}
    ${pro() ? expert : expertHint('Счётчики Метрики, кабинеты Директа, Яндекс Аудитории и история обновлений')}
  </div></div>`
}

    ['История обновлений и «Загрузить всё заново»', 'hide', 'step', 'connect,expert', ''],
  ]],
  ['Аккаунт и тариф', 'Про ИИ человек видит только процент лимита — без денег и токенов.', [
    ['Лимит ИИ в процентах', 'see', 'see', 'plan', 'Всегда внизу бокового меню'],
    ['Предупреждения на 80% и 100% лимита', 'auto', 'auto', 'plan', ''],
    ['Тарифы, оплата, промокод, реферальная ссылка', 'step', 'step', 'plan', ''],
    ['На что ушёл лимит: модели, проекты, дни', 'hide', 'step', 'plan,expert', ''],
    ['Профиль и вход', 'step', 'step', 'settings', ''],
    ['Уведомления: сводка, Telegram, срочные', 'step', 'step', 'settings,tab-notif', ''],
    ['Экспертный режим и тема', 'step', 'step', 'settings,tab-ui', ''],
    ['Помощь и поддержка', 'step', 'step', '', 'В меню профиля, правый верхний угол'],
  ]],
]

const tier = (t, now) => `<span class="tier tier--${t} ${now ? 'is-now' : ''}">${ic(TIERS[t][0], 13)}${TIERS[t][1]}</span>`

function mapPage() {
  const rows = MAP.flatMap((s) => s[2])
  const count = (i, t) => rows.filter((r) => r[i] === t).length
  const col = pro() ? 2 : 1
  const onlyExpert = rows.filter((r) => r[1] === 'hide').length
  const row = (r) => `<tr><td><b>${r[0]}</b>${r[4] ? `<small>${r[4]}</small>` : ''}</td>
    <td class="${pro() ? '' : 'is-now'}">${tier(r[1], !pro())}</td><td class="${pro() ? 'is-now' : ''}">${tier(r[2], pro())}</td>
    <td class="r">${r[3] ? `<button class="btn btn--sm" data-act="jump:${r[3]}">${r[3].includes('expert') ? 'В экспертном' : 'Показать'}${ic('right', 14)}</button>` : ''}</td></tr>`
  return `<div class="solo" data-scroll="map"><div class="wide">
    <div class="head"><div><p class="eyebrow">Что показываем сразу, а что убираем подальше</p><h1>Карта функций</h1></div>
      <div class="head__acts"><button class="btn" data-act="go:home">${ic('left', 15)}В кабинет</button></div></div>
    <p class="lead"><span>В кабинете ${rows.length} ${plural(rows.length, 'функция', 'функции', 'функций')}. Обычный режим оставляет на виду то, что нужно каждый день: спросить ИИ, принять решение, почистить запросы, посмотреть итог. Тонкие инструменты не пропали — сервис либо делает их сам и приносит предложение, либо они открываются в экспертном режиме. Сейчас включён <b>${pro() ? 'экспертный' : 'обычный'}</b> режим: его столбец подсвечен.</span></p>
    <div class="tiles tiles--4">
      ${tile('На виду в обычном режиме', count(1, 'see'), 'главное, каждый день')}
      ${tile('В один шаг', count(1, 'step'), 'вкладка, строка или меню')}
      ${tile('Сервис делает сам', count(1, 'auto'), 'приходит сигналом или предложением')}
      ${tile('Только в экспертном', onlyExpert, 'фильтры, таблицы, правила')}
    </div>
    <div class="card pad tierlist">${Object.keys(TIERS).map((t) => `<div>${tier(t)}<span>${TIERS[t][2]}</span></div>`).join('')}</div>
    ${MAP.map(([title, text, list]) => `<h2>${title} <span>${list.length}</span><small>на виду в ${pro() ? 'экспертном' : 'обычном'}: ${list.filter((r) => r[col] === 'see').length}</small></h2>
      <p class="muted maptext">${text}</p>
      <div class="card scroll-x"><table class="tbl maptbl"><tr><th>Функция</th><th>Обычный режим</th><th>Экспертный режим</th><th></th></tr>${list.map(row).join('')}</table></div>`).join('')}
    <p class="meta">Кнопка «В экспертном» открывает раздел и сама включает экспертный режим. Вернуться к карте — кнопка «Карта функций» в чёрной полосе сверху.</p>
  </div></div>`
}

/* ---------- первый вход ---------- */

const START_STEPS = ['Почта', 'Яндекс', 'Сайты', 'Загрузка', 'Вопрос ИИ']
/* Сколько сайтов можно подключить на пробном периоде. */
const START_LIMIT = 5

function startBody(n) {
  const next = (label, to = n + 1, off = false) => `<button class="btn btn--pri" data-act="step:${to}" ${off ? 'disabled' : ''}>${label}${ic('right', 15)}</button>`
  const back = n > 1 ? `<button class="btn btn--ghost" data-act="step:${n - 1}">Назад</button>` : ''
  if (n === 1) {
    return `<h2>Создайте аккаунт</h2><p class="muted">Почта нужна для входа и для сводок. Пришлём письмо со ссылкой — подтвердите адрес, и можно продолжать.</p>
      <div class="form form--one">${field('smail', 'Почта', M.user.email)}${field('sname', 'Как к вам обращаться', M.user.name)}</div>
      <div class="form__foot">${next('Продолжить')}<small>Сначала — бесплатный пробный период.</small></div>`
  }
  if (n === 2) {
    return `<h2>Подключите Яндекс</h2><p class="muted">Сервис читает вашу рекламу и статистику сайта. Вход — через страницу Яндекса, пароль мы не видим.</p>
      <div class="card">${lrow('Яндекс Директ', 'Кампании, объявления, фразы и расходы. Нужен, чтобы видеть картину и вносить изменения, которые вы подтвердили.', '', ic('megaphone', 18))}
        ${lrow('Яндекс Метрика', 'Визиты и цели сайта. Нужна, чтобы считать заявки и их цену.', '', ic('chart', 18))}</div>
      <p class="good">${ic('check', 16)}<span>Сервис ничего не меняет в рекламе сам. Любое изменение ждёт вашей кнопки «Выполнить», а потом его можно вернуть в «Истории».</span></p>
      <div class="form__foot">${next('Войти через Яндекс')}${back}</div>`
  }
  if (n === 3) {
    const picked = M.counters.filter((c, i) => (i < 4) !== on(`sitex:${i}`)).length
    const over = picked > START_LIMIT
    return `<h2>Выберите сайты</h2><p class="muted">В вашем Яндексе нашлось ${M.counters.length} счётчиков Метрики. Один счётчик — один проект в кабинете. Остальные можно добавить позже в «Подключениях».</p>
      <div class="card">${M.counters.map((c, i) => `<div class="lrow">${checkBtn(`flag:sitex:${i}`, (i < 4) !== on(`sitex:${i}`), c[0])}<div><b>${c[0]}</b><small>счётчик ${c[1]}${c[2] ? ` · ${project(c[2]).camps} ${plural(project(c[2]).camps, 'кампания', 'кампании', 'кампаний')} в Директе` : ' · кампаний в Директе не найдено'}</small></div></div>`).join('')}</div>
      <p class="${over ? 'st st--bad' : 'muted'}">${over ? `${ic('alert', 13)}Выбрано ${picked}, а на пробном периоде можно до ${START_LIMIT}. Снимите лишнюю галочку.` : `Выбрано ${picked} из ${START_LIMIT} доступных.`}</p>
      <div class="form__foot">${next('Загрузить данные', 4, over || !picked)}${back}</div>`
  }
  if (n === 4) {
    return `<h2>Данные загружены</h2><p class="muted">Обычно это занимает пару минут. Дальше сервис обновляет данные сам, несколько раз в день.</p>
      <ul class="checklist">${['Кампании, группы и объявления из Директа: 11 кампаний', 'Расходы и клики за последние 90 дней', 'Цели и заявки из Метрики', 'Поисковые запросы за 30 дней: 148 запросов', 'Цель по цене заявки: взяли из стратегий Директа'].map((t) => `<li>${ic('check', 15)}<span>${t}</span></li>`).join('')}</ul>
      <div class="form__foot">${next('Посмотреть, что получилось')}${back}</div>`
  }
  return `<h2>Готово. Вот что сервис уже заметил</h2><p class="muted">Это посчитал код, без ИИ — лимит не потрачен. Цель «заявка не дороже 450 ₽» взята из ваших стратегий в Директе, её можно поменять в настройках проекта.</p>
    <div class="card">${lrow('23 мусорных запроса съели 3 240 ₽ за месяц', 'Их можно добавить в минус-фразы за одну минуту.', `<button class="btn btn--sm" data-act="at:okna=queries">Открыть</button>`, ic('filter', 18))}
      ${lrow('У одной кампании заявка стоит вдвое дороже цели', '«Окна ПВХ — РСЯ» на сайте msk.okna-profi.ru.', `<button class="btn btn--sm" data-act="chat:c2">Разобрать с ИИ</button>`, ic('alert', 18))}</div>
    <div class="form__foot"><button class="btn btn--pri" data-act="go:home">Открыть кабинет${ic('right', 15)}</button><button class="btn" data-act="chat:c1">${ic('sparkles', 15)}Спросить ИИ: разбери кампании</button>${back}</div>`
}

function startPage() {
  const n = Math.min(Math.max(S.step, 1), START_STEPS.length)
  return `<div class="solo" data-scroll="start"><div class="start">
    <div class="brand"><i>${ic('sparkles', 16)}</i>AiMarketing</div>
    <ol class="stepper">${START_STEPS.map((t, i) => `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'cur' : ''}"><button data-act="step:${i + 1}" ${i + 1 > n ? 'disabled' : ''}><i>${i + 1 < n ? ic('check', 13) : i + 1}</i><span>${t}</span></button></li>`).join('')}</ol>
    <div class="card open pad start__card">${startBody(n)}</div>
    <p class="meta">Так выглядит первый вход: пять шагов от почты до первого полезного действия. В рабочем кабинете шаг «Яндекс» открывает страницу входа Яндекса.</p>
  </div></div>`
}

Object.assign(ACT, {
  step: (v) => (S.step = +v),
})

boot()
</script>
</body>
</html>
