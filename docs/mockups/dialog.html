<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет AiMarketing «Диалог»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Каркас макета: полоса с вкладками вариантов и общие сбросы. Стили вариантов лежат в vN.css и действуют только внутри .vN. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: #17181a; font: 13px/1.4 'Inter', system-ui, 'Segoe UI', sans-serif; }
#bar { flex: none; display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; background: #17181a; color: #8d9096; white-space: nowrap; overflow: hidden; }
#bar strong { color: #fff; font-weight: 600; }
#bar nav { display: flex; gap: 2px; }
#bar button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: #c9ccd1; font: inherit; font-weight: 500; cursor: pointer; }
#bar button:hover { background: #2a2c30; color: #fff; }
#bar button.active { background: #fff; color: #17181a; }
#bar span { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
#app { flex: 1; min-height: 0; }
.v { height: 100%; overflow: auto; container-type: inline-size; }
.v button { cursor: pointer; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.v input, .v textarea { font: inherit; color: inherit; }
.v h1, .v h2, .v h3, .v h4, .v p, .v figure { margin: 0; }
.v .ic { flex: none; }
.v .num { font-variant-numeric: tabular-nums; }
.v .spark, .v .bars { display: block; }
.v .chart { display: block; width: 100%; height: auto; }
.v .dots { display: inline-flex; gap: 2px; }
.v .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .5; }
.v .dots i.on { background: currentColor; opacity: 1; }
.v .st { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; white-space: nowrap; }

#bar { overflow-x: auto; scrollbar-width: none; }
#bar strong, #bar nav { flex: none; }
#bar nav { align-items: center; }
#bar em { margin-right: 4px; font-style: normal; }
#bar span { min-width: 0; }
#bar a { color: #c9ccd1; }

.v2 {
& {
  --bg: #f4f4f1; --side: #ecece8; --surface: #fff; --surface-2: #f7f7f4; --ink: #141413; --ink-2: #5c5c57; --ink-3: #696963;
  --line: #e2e2dc; --lime: #c6f04a; --lime-soft: #eef8cf; --pri: #141413; --pri-ink: #fff; --series: #141413;
  --ok: #1a7f4e; --warn: #875d00; --bad: #c0392b;
  --shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 8px 24px rgba(20, 20, 19, .06);
}
&[data-theme='dark'] {
  --bg: #0f100f; --side: #151615; --surface: #1a1b1a; --surface-2: #212221; --ink: #f1f1ee; --ink-2: #a8a8a2; --ink-3: #8c8c85;
  --line: #2a2b29; --lime-soft: #2a3312; --pri: #c6f04a; --pri-ink: #141413; --series: #c6f04a;
  --ok: #5fd08f; --warn: #e6b450; --bad: #f08a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
}
& { overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.5 'Manrope', system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
b, strong { font-weight: 700; }

/* ---- боковая панель ---- */
.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: auto; padding: 14px 10px 12px; background: var(--side); }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
.brand i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--lime); color: #141413; font-style: normal; }
.newchat { display: flex; align-items: center; gap: 9px; flex: none; height: 40px; padding: 0 12px; margin-bottom: 8px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.newchat:hover { border-color: var(--ink-3); }
.srow { display: flex; align-items: center; gap: 10px; flex: none; width: 100%; height: 34px; padding: 0 10px; border-radius: 9px; color: var(--ink-2); font-weight: 600; font-size: 14px; text-align: left; }
.srow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
.srow.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.srow .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--lime); color: #141413; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.srow .pin { flex: none; width: 8px; height: 8px; margin: 0 1px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1.5px var(--ink); }
.side h4 { margin: 16px 10px 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.pop { position: relative; flex: none; }
.menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; font-weight: 500; }
.menu button:hover { background: var(--surface-2); }
.side__foot { margin-top: auto; padding: 18px 10px 4px; }
.limit { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.limit b { color: var(--ink); }
.limit__bar { height: 6px; margin: 6px 0; border-radius: 3px; background: var(--line); overflow: hidden; }
.limit__bar i { display: block; height: 100%; border-radius: 3px; background: var(--pri); }
.side__foot small { color: var(--ink-3); font-size: 12px; }

/* ---- общее ---- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mbar { flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; }
.mbar__title { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; font-size: 15px; white-space: nowrap; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip--btn:hover { border-color: var(--ink-3); color: var(--ink); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.dot--ok { background: var(--ok); } .dot--warn { background: var(--warn); } .dot--bad { background: var(--bad); }
.st { font-size: 12px; }
.st--ok { color: var(--ok); } .st--warn { color: var(--warn); } .st--bad { color: var(--bad); } .st--off { color: var(--ink-3); }
.seg { display: flex; padding: 3px; border-radius: 10px; background: var(--side); }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.iconbtn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--ink-2); }
.iconbtn:hover, .iconbtn.on { background: var(--side); color: var(--ink); }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; }
.page { flex: 1; min-height: 0; overflow: auto; }
.col { max-width: 820px; margin: 0 auto; padding: 36px 24px 72px; }
.wide { max-width: 1100px; margin: 0 auto; padding: 12px 28px 32px; }
.eyebrow { color: var(--ink-3); font-size: 13px; font-weight: 600; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; }
.col > .eyebrow, .col > h1 { text-align: center; }
.col > h1 { font-size: 40px; }
h2 { display: flex; align-items: baseline; gap: 8px; margin: 34px 0 10px; font-size: 15px; font-weight: 800; }
h2 > span:not(.st) { color: var(--ink-3); font-weight: 600; }
h2 > .st { font-size: 14px; align-self: center; }
h2 small { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.muted { color: var(--ink-3); }
p.muted { font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn--pri { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn--pri:hover { border-color: var(--pri); filter: brightness(1.12); }
.btn--ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }
.btn--sm { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 13px; }
.btn--icon { width: 36px; padding: 0; }

/* ---- строка вопроса ---- */
.composer { padding: 12px 12px 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--ink-3); }
.composer textarea { display: block; width: 100%; padding: 2px 0 8px; border: 0; outline: 0; background: none; resize: none; font-size: 15px; line-height: 1.5; }
.composer textarea::placeholder, .askbar__box input::placeholder { color: var(--ink-3); }
.composer--big { margin-top: 26px; padding: 18px 14px 12px 22px; border-radius: 26px; }
.composer--big textarea { font-size: 17px; }
.composer__row { display: flex; align-items: center; gap: 8px; }
.composer__row .chip { background: var(--surface-2); }
.composer__row .send { margin-left: auto; }
.send { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: #141413; }
.send:hover { filter: brightness(.94); }
.starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.col > .starters { justify-content: center; }
.starters button { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.starters button:hover { border-color: var(--ink-3); color: var(--ink); }

/* ---- главная ---- */
.kline { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 30px; }
.kline > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 6px; padding: 14px 16px; border-left: 1px solid var(--line); }
.kline > div:first-child { border-left: 0; }
.kline small { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.kline b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.kline span { grid-column: 1 / -1; grid-row: 3; color: var(--ink-2); font-size: 12px; }
.kline .spark { grid-column: 2; grid-row: 2; color: var(--ink-3); }
.prow { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow > div:first-child { flex: 1; min-width: 0; }
.prow > div:first-child > small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.prow > div:first-child > b { display: block; font-size: 15px; }
.prow > div:first-child > p { color: var(--ink-2); font-size: 14px; }
.prow__acts { display: flex; align-items: center; gap: 6px; flex: none; }
.prow.is-closed > div:first-child > b { color: var(--ink-3); font-weight: 500; }
.diff { margin-top: 8px; border-collapse: collapse; font-size: 13px; }
.diff td { padding: 3px 16px 3px 0; color: var(--ink-2); }
.diff s { color: var(--ink-3); }
.diff b { color: var(--ink); }
.sigs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sig { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.sig__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.sig h3 { font-size: 15px; line-height: 1.35; font-weight: 700; }
.sig p { color: var(--ink-2); font-size: 14px; }
.sig__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; }
.sig__acts .btn { height: 36px; padding: 0 13px; }
.sig__acts .btn--icon { margin-left: auto; padding: 0; }
.sig.is-closed { flex-direction: row; align-items: center; justify-content: space-between; color: var(--ink-3); }
.sig.is-closed p { display: flex; align-items: center; gap: 8px; color: var(--ink-3); }
.pstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pc { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; padding: 14px 16px; text-align: left; }
.pc:hover { border-color: var(--ink-3); }
.pc > b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.pc p { color: var(--ink-2); font-size: 13px; line-height: 1.35; }
.pc__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; width: 100%; margin-top: 6px; color: var(--ink-3); font-size: 12px; line-height: 1.45; }

/* ---- чат и панель с данными ---- */
.chatwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.chatwrap.has-canvas { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.thread__scroll { flex: 1; min-height: 0; overflow: auto; }
.thread__in { max-width: 740px; margin: 0 auto; padding: 14px 28px 28px; }
.thread__foot { flex: none; width: 100%; max-width: 740px; margin: 0 auto; padding: 0 28px 16px; }
.msg-user { display: flex; justify-content: flex-end; margin-bottom: 22px; }
.msg-user > div { max-width: 82%; padding: 11px 16px; border-radius: 18px 18px 4px 18px; background: var(--side); font-weight: 600; }
.msg-ai { display: flex; flex-direction: column; gap: 14px; line-height: 1.6; }
.msg-ai ol { display: grid; gap: 8px; margin: 0; padding-left: 22px; }
.refs { display: flex; flex-wrap: wrap; gap: 8px; }
.refs button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.refs button:hover { border-color: var(--ink-3); }
.fig.card { padding: 14px 16px 10px; }
.fig figcaption { margin-bottom: 6px; color: var(--ink-2); font-size: 13px; font-weight: 700; }
.good { display: flex; align-items: flex-start; gap: 8px; color: var(--ink-2); }
.good .ic { margin-top: 4px; color: var(--ok); }
.steps { color: var(--ink-2); font-size: 14px; }
.steps summary { width: fit-content; cursor: pointer; color: var(--ink-3); font-weight: 700; font-size: 13px; }
.steps ul { margin: 6px 0 0; padding-left: 20px; }
.ref { padding: 16px 18px; background: var(--lime-soft); border-color: transparent; }
.ref.is-closed { background: var(--surface); border-color: var(--line); }
.ref__head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--lime); color: #141413; font-size: 12px; font-weight: 700; }
.ref p { color: var(--ink-2); font-size: 14px; }
.ref__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.canvas { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 0 14px 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.canvas__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; }
.tabs button { height: 32px; padding: 0 12px; border-radius: 8px; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.canvas__body { container: canvas / inline-size; flex: 1; min-height: 0; overflow: auto; padding: 20px 22px; }
.canvas__body h3 { margin: 2px 0 4px; font-size: 21px; line-height: 1.25; font-weight: 800; letter-spacing: -.02em; }
.canvas__body .tbl, .canvas__body .fig { margin-top: 14px; }
.canvas__foot { flex: none; padding: 14px 22px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.canvas__foot > div { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.canvas__foot small { display: block; margin-top: 8px; color: var(--ink-3); font-size: 12px; line-height: 1.4; }
.notes { display: grid; gap: 8px; margin: 14px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.notes b { color: var(--ink); }
.effect { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.effect > div { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.effect small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.effect b { font-size: 15px; }
.hl { padding: 2px 7px; border-radius: 6px; background: var(--lime); color: #141413; }

/* ---- таблицы ---- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink-3); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl td small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.tbl td > b { font-weight: 600; }
.tbl s { color: var(--ink-3); }
.tbl tr.is-change td { background: var(--lime-soft); }
.tbl .bars { color: var(--ink-3); }
.tbl tr.grp td { padding: 8px 12px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.tbl tr.grp b { color: var(--ink); }
.grp__act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.card.scroll-x { overflow-x: auto; }

/* ---- кампании ---- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.wide > h2:first-of-type { margin-top: 18px; }
.check { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--ink-3); color: transparent; }
.check:hover { border-color: var(--ink); }
.check.on { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.switch { position: relative; display: block; flex: none; width: 36px; height: 20px; border-radius: 999px; background: var(--ink-3); transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(16px); }
.crow { display: grid; grid-template-columns: auto minmax(0, 1.3fr) minmax(0, 1fr) 96px auto; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow.is-sel { background: var(--lime-soft); }
.crow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.crow small { display: block; color: var(--ink-3); font-size: 12px; }
.crow__health { color: var(--ink-2); font-size: 14px; }
.crow__num { text-align: right; }
.askbar { flex: none; padding: 10px 28px 16px; border-top: 1px solid var(--line); }
.askbar__in { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; max-width: 1044px; margin: 0 auto; padding: 12px 12px 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.askbar__ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; color: var(--ink-2); font-size: 13px; }
.askbar__ctx .chip { height: 24px; background: var(--lime-soft); border-color: transparent; color: var(--ink); }
.askbar__ctx .chip button { display: grid; place-items: center; margin-right: -4px; color: var(--ink-2); }
.askbar .starters { grid-column: 2; grid-row: 1; margin: 0; }
.askbar .starters button { height: 28px; padding: 0 11px; font-size: 13px; background: var(--surface-2); }
.askbar__box { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.askbar__box input { flex: 1; min-width: 0; height: 36px; padding: 0; border: 0; outline: 0; background: none; font-size: 15px; }

/* ---- запросы ---- */
.summary { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding: 16px 18px; background: var(--lime-soft); border-color: transparent; }
.summary p { flex: 1; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rcard { display: flex; flex-direction: column; padding: 16px 18px; }
.rcard header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rcard h3 { font-size: 16px; font-weight: 800; }
.rcard header span { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.rcard ul { list-style: none; margin: 10px 0 12px; padding: 0; font-size: 14px; }
.rcard li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px dashed var(--line); color: var(--ink-2); }
.rcard li span { color: var(--ink-3); white-space: nowrap; }
.rcard footer { display: flex; align-items: center; gap: 6px; margin-top: auto; }
.rcard.is-done ul { opacity: .55; text-decoration: line-through; }
.qrow { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); }
.qrow:first-child { border-top: 0; }
.qrow > div:first-child { flex: 1; min-width: 0; }
.qrow b { display: block; font-weight: 700; }
.qrow small { color: var(--ink-3); font-size: 13px; }
.qrow > .num { font-size: 13px; white-space: nowrap; }
.pick { display: inline-flex; flex: none; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.pick button { height: 26px; padding: 0 11px; border-radius: 7px; color: var(--ink-2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.pick button:hover { color: var(--ink); }
.pick button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.pick .yes.on { color: var(--ok); }
.pick .no.on { color: var(--bad); }
.okrow { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 18px; color: var(--ink-2); font-size: 14px; }
.okrow .st { font-size: 14px; }
.okrow .btn { margin-left: auto; }

/* ---- график ---- */
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-tick { fill: var(--ink-3); font-size: 11px; }
.ch-label { fill: var(--ink-2); font-size: 11px; }
.ch-value { fill: var(--ink); font-size: 12px; font-weight: 700; }
.ch-week { fill: var(--ink-3); opacity: .08; }
.ch-target { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ch-line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-end { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.ch-dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.ch-hit:hover .ch-dot { opacity: 1; }

@container canvas (max-width: 550px) {
  .tbl .opt { display: none; }
  .tbl th, .tbl td { padding-left: 8px; padding-right: 8px; }
}
@container (max-width: 1180px) {
  .shell { grid-template-columns: 228px minmax(0, 1fr); }
  .pstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kline { grid-template-columns: repeat(2, 1fr); }
  .kline > div:nth-child(3) { border-left: 0; }
  .kline > div:nth-child(n + 3) { border-top: 1px solid var(--line); }
  .askbar__in { grid-template-columns: minmax(0, 1fr); }
  .askbar .starters { grid-column: 1; grid-row: auto; }
}
@container (max-width: 1040px) {
  .chatwrap.has-canvas { grid-template-columns: minmax(0, 1fr); }
  .canvas { position: absolute; top: 56px; right: 0; bottom: 0; z-index: 10; width: min(540px, calc(100% - 20px)); margin: 0 10px 10px 0; }
  .sigs, .rgrid { grid-template-columns: minmax(0, 1fr); }
  .prow, .qrow { flex-wrap: wrap; }
  .crow { grid-template-columns: auto minmax(0, 1fr) 96px auto; }
  .crow__health { grid-column: 2 / -1; grid-row: 2; margin-top: -10px; }
}
@container (max-width: 700px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .col > h1 { font-size: 30px; }
}

/* Полный макет «Диалог»: всё, чего не было в первом варианте 2. Вкладывается в .v2 после v2.css и пользуется его переменными. */

h5, dl, dd { margin: 0; }
a { color: inherit; }
.btn:disabled, button:disabled { opacity: .45; cursor: default; pointer-events: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---- боковая панель: список прокручивается, лимит всегда внизу ---- */
.shell { position: relative; }
.side { gap: 0; overflow: hidden; padding: 0; }
.side__scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; overflow: auto; padding: 14px 10px 12px; }
.brand { flex: none; width: 100%; text-align: left; }
.brand em { padding: 2px 7px; border-radius: 999px; background: var(--ink); color: var(--bg); font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0; }
.side h5 { margin: 10px 10px 2px; color: var(--ink-3); font-size: 11px; font-weight: 700; }
.srow-wrap { position: relative; display: flex; flex: none; }
.srow-wrap:has(.srow__gear) .srow { padding-right: 36px; }
.srow__gear { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--ink-2); }
.srow__gear:hover { background: var(--side); color: var(--ink); }
.srow--quiet { color: var(--ink-3); font-weight: 500; }
.side__foot { flex: none; display: block; width: 100%; margin: 0; padding: 12px 20px 14px; border-top: 1px solid var(--line); text-align: left; }
.side__foot:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.side__foot .limit__bar, .side__foot small { display: block; }
.drawer-scrim, .burger { display: none; }

/* ---- верхняя строка ---- */
.mbar { position: relative; z-index: 20; }
.mbar__title b { overflow: hidden; text-overflow: ellipsis; }
.sync { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 28px; padding: 0 10px; border-radius: 8px; color: var(--ink-3); font-size: 12px; font-weight: 600; white-space: nowrap; }
.sync:hover { background: var(--side); color: var(--ink); }
.chip--lime { background: var(--lime); border-color: transparent; color: #141413; }
.chip--lime.chip--btn:hover { border-color: #141413; color: #141413; }
.chip--lock { background: var(--surface-2); }
.chip.is-on { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.menu { max-height: 340px; overflow: auto; }
.menu--right, .head__acts .menu { left: auto; right: 0; }
.menu button > .ic:last-child:not(:only-child) { margin-left: auto; }
.menu hr { height: 0; margin: 6px 0; border: 0; border-top: 1px solid var(--line); }
.menu__me { padding: 8px 10px 6px; }
.menu__me b, .menu__me small { display: block; }
.menu__me small { color: var(--ink-3); font-size: 12px; }
.banner { flex: none; display: flex; align-items: center; gap: 12px; margin: 0 20px 8px; padding: 10px 10px 10px 14px; border-radius: 12px; background: var(--lime-soft); font-size: 14px; }
.banner > span { flex: 1; min-width: 0; color: var(--ink-2); }
.banner b { color: var(--ink); }

/* ---- кнопки и ссылки ---- */
.btn--danger { color: var(--bad); }
.btn--danger:hover { border-color: var(--bad); }
.lnk { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: var(--ink); }
.lnk.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; text-decoration: none; }
.lnk.back:hover { color: var(--ink); }
.cname { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; text-align: left; }
.cname:hover { text-decoration: underline; text-underline-offset: 3px; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
.acts--tight { margin-top: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.between > div:first-child { min-width: 0; }

/* ---- страница ---- */
.head > div:first-child { min-width: 0; }
.head__acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.wide--form { max-width: 820px; }
.ptabs { gap: 4px; margin: 0 0 18px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.ptabs button { flex: none; height: 38px; border-radius: 0; white-space: nowrap; }
.ptabs button.active { background: none; box-shadow: inset 0 -2px 0 var(--ink); }
.lead { display: flex; align-items: flex-start; gap: 10px; max-width: 800px; margin-bottom: 18px; font-size: 16px; line-height: 1.5; }
.lead > .ic, .lead > .st { margin-top: 4px; }
.lead > .st { font-size: 14px; }
.meta { margin-top: 12px; color: var(--ink-3); font-size: 13px; line-height: 1.45; }
.cap { display: block; margin-bottom: 6px; color: var(--ink-3); font-size: 12px; font-weight: 700; }
h3.cap { margin-bottom: 10px; }
.big { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.big span { color: var(--ink-3); font-size: 15px; font-weight: 600; letter-spacing: 0; }
.pad { padding: 18px 20px; }
.card.open { overflow: visible; }
.card + .card, .card + .acts { margin-top: 12px; }
/* В сетках расстояние задаёт gap: соседние карточки не должны съезжать вниз. */
:is(.rgrid, .sigs, .duo, .plan-grid, .tiles) > .card { margin-top: 0; }
.duo + .card { margin-top: 12px; }
.seg { width: fit-content; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
h2 > small > button.chip { height: 24px; font-size: 12px; }
h2 > .seg { margin-left: auto; align-self: center; }
h2 > .seg + small { margin-left: 0; }
.xhint { display: flex; align-items: flex-start; gap: 8px; margin-top: 24px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-2); font-size: 13px; }
.xhint .ic { margin-top: 2px; color: var(--ink-3); }
.xhint button { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 44px 24px; color: var(--ink-2); text-align: center; }
.empty > .ic { color: var(--ink-3); }
.empty h2 { justify-content: center; margin: 4px 0 0; font-size: 19px; }
.empty p { max-width: 460px; font-size: 14px; }
.empty > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.empty small { font-size: 12px; }
.empty--sm { padding: 26px 20px; }
.col.empty { padding-top: 96px; }

/* ---- плитки, пары карточек, шкалы ---- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tiles--4, .tiles:has(> .tile:nth-child(4)) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.tile small { color: var(--ink-3); font-size: 12px; font-weight: 600; }
.tile b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; white-space: nowrap; }
.tile > span { color: var(--ink-2); font-size: 13px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--series); }
.meter--wide { display: block; width: 100%; margin: 10px 0; }
.dl { display: grid; gap: 6px; margin: 12px 0 0; font-size: 14px; }
.dl > div { display: flex; justify-content: space-between; gap: 16px; }
.dl dt { color: var(--ink-3); }
.dl dd { font-weight: 600; text-align: right; }
/* Колонки общие на весь список: полосы начинаются с одной линии, иначе их длины нельзя сравнить. */
.hbars { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) auto auto; gap: 10px 12px; }
.hbar { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: center; font-size: 14px; }
.hbar > b { text-align: right; }
.hbar__l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hbar__bar { display: block; height: 10px; }
.hbar__bar i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--series); }
.hbar small { min-width: 64px; color: var(--ink-3); font-size: 12px; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 0; border-top: 2px solid var(--series); }
.legend i.prev { border-top: 2px dashed var(--ink-3); }
.ch-line--prev { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 5 4; }
.ch-dot--prev { fill: var(--ink-3); }
.ch-bar { fill: var(--series); }
/* Подписи на графике лежат на подложке цвета карточки: линия под ними не мешает читать. */
.ch-value, .ch-label { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.ch-hit:hover .ch-bar { opacity: .75; }
.ch-hit rect:not(.ch-bar) { fill: transparent; }

/* ---- формы ---- */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form--one { grid-template-columns: minmax(0, 1fr); }
.form + .card, .card + .form { margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span:first-child { color: var(--ink-2); font-size: 13px; font-weight: 700; }
.field small { color: var(--ink-3); font-size: 12px; line-height: 1.4; }
.field--wide { grid-column: 1 / -1; }
.field--row { flex-direction: row; align-items: center; gap: 8px; }
.field--row > span:first-child { font-weight: 600; white-space: nowrap; }
.field > .pop, .field > .seg { align-self: flex-start; }
.inp { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.inp:focus-within, .field textarea:focus { border-color: var(--ink-3); }
.inp input { flex: 1; min-width: 0; width: 100%; height: 100%; padding: 0; border: 0; outline: 0; background: none; }
.inp input::placeholder, .field textarea::placeholder { color: var(--ink-3); }
.inp i { flex: none; color: var(--ink-3); font-style: normal; font-size: 13px; }
.inp--sm { display: inline-flex; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
.inp--sm input { flex: none; width: 56px; text-align: right; }
.inp--search { width: 240px; height: 34px; color: var(--ink-3); }
.inp--search input { color: var(--ink); font-size: 14px; }
.field--row .inp { height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
.field--row .inp input { flex: none; text-align: right; }
.field textarea { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; outline: 0; background: var(--surface); resize: vertical; line-height: 1.5; }
.form__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
.form__foot small { color: var(--ink-3); font-size: 12px; }
.form__foot--page { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
.irow { display: flex; align-items: flex-end; gap: 8px; margin-top: 12px; }
.irow > .field { flex: 1; }
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.fbar > .muted { margin-left: auto; font-size: 13px; }
.fbar--top { margin-bottom: 14px; }
.kline + .fbar { margin-top: 12px; }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--lime-soft); font-size: 14px; }
.bulk > b { margin-right: 6px; }
.swlabel { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.trow { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow > div { flex: 1; min-width: 0; }
.trow b { display: block; font-size: 14px; }
.trow p { color: var(--ink-2); font-size: 13px; line-height: 1.4; }
.checklist { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
.checklist li { display: flex; align-items: flex-start; gap: 8px; color: var(--ink-2); }
.checklist .ic { margin-top: 3px; color: var(--ok); }
.checklist li.no .ic { color: var(--ink-3); }

/* ---- окна, уведомления ---- */
.scrim { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(15, 16, 15, .5); }
.modal { display: flex; flex-direction: column; width: min(520px, 100%); max-height: 100%; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); cursor: default; }
.modal > header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 14px 6px 22px; }
.modal h3 { font-size: 19px; line-height: 1.3; font-weight: 800; letter-spacing: -.02em; }
.modal__body { display: grid; gap: 12px; min-height: 0; overflow: auto; padding: 6px 22px 8px; font-size: 15px; }
.modal__body .dl { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.modal > footer { flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 22px 20px; }
.toast { position: absolute; top: 64px; left: 50%; z-index: 70; display: flex; align-items: center; gap: 10px; max-width: min(640px, calc(100% - 32px)); padding: 10px 16px; border-radius: 14px; background: #141413; color: #fff; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); font-size: 14px; font-weight: 600; transform: translateX(-50%); }
.toast > .ic { color: var(--lime); }
.toast button { flex: none; color: var(--lime); font-weight: 700; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
&[data-theme='dark'] .toast { border: 1px solid var(--line); background: #262725; }

/* ---- главная ---- */
.col > .tiles { margin-top: 8px; }
.crow--lite { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 96px auto; }
.crow .st { justify-self: end; }
.sig.is-closed, .prow.is-closed, .ref.is-closed { opacity: .8; }
.hline { display: flex; align-items: flex-start; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 14px; }
.hline:first-child { border-top: 0; }
.hline > .ic { margin-top: 3px; color: var(--ink-3); }
.hline b, .hline small { display: block; }
.hline b { font-weight: 600; }
.hline small { color: var(--ink-3); font-size: 12px; }

/* ---- чат: вопросы ИИ, план, доска сборки кампании ---- */
.qcard { padding: 14px 16px; }
.qcard small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.qcard p { display: flex; align-items: flex-start; gap: 8px; margin-top: 4px; color: var(--ink-2); font-size: 14px; }
.qcard p .ic { margin-top: 4px; color: var(--ok); }
.plan { padding: 16px 18px; }
.plan ol { display: grid; gap: 2px; margin: 8px 0 0; padding: 0; list-style: none; }
.plan li button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 8px; color: var(--ink-2); font-size: 14px; text-align: left; }
.plan li button:hover { background: var(--surface-2); color: var(--ink); }
.plan li i { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); font-style: normal; font-size: 11px; font-weight: 700; }
.plan li.done i { border-color: var(--pri); background: var(--pri); color: var(--pri-ink); }
.plan li.cur button { color: var(--ink); font-weight: 700; }
.plan li.cur i { border-color: var(--ink); }
.msg-ai + .msg-user { margin-top: 22px; }
.msg-ai > .card.scroll-x { font-size: 14px; }
.bname { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 6px; }
.bname b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- форматирование ---------- */

const num = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')
const rub = (n) => `${num(n)} ₽`
const delta = (d) => `${d > 0 ? '+' : '−'}${Math.abs(d)}%`
const project = (id) => M.projects.find((p) => p.id === id)
const projectName = (id) => (id ? project(id).name : 'Все проекты')
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

/** «Заявка 402 ₽ при цели 450 ₽» или «ДРР 14% при цели 18%». */
function kpiText(p) {
  return p.kpi === 'CPA' ? `Заявка ${rub(p.value)} при цели ${rub(p.target)}` : `ДРР ${p.value}% при цели ${p.target}%`
}
/** Короткий вывод простыми словами. */
function kpiVerdict(p) {
  const d = Math.round((p.value / p.target - 1) * 100)
  if (d <= 0) return p.kpi === 'CPA' ? `Заявки на ${-d}% дешевле цели` : 'Расходы в пределах цели'
  return p.kpi === 'CPA' ? `Заявки на ${d}% дороже цели` : `Расходы на ${d}% выше цели`
}
/** Что с кампанией — одной фразой, без терминов. */
function campHealth(c) {
  const p = project(c.project)
  if (!c.on) return 'Остановлена 3 ноября'
  if (c.drr != null) return c.drr <= p.target ? `ДРР ${c.drr}% — в цели` : `ДРР ${c.drr}% — чуть выше цели ${p.target}%`
  if (!c.conv) return `${rub(c.cost)} за неделю, заявок нет`
  const d = Math.round((c.cpa / p.target - 1) * 100)
  if (d <= 0) return `Заявка ${rub(c.cpa)} — в цели`
  return d > 30 ? `Заявка ${rub(c.cpa)} — на ${d}% дороже цели` : `Заявка ${rub(c.cpa)} — чуть дороже цели ${rub(p.target)}`
}
const campKpi = (c) => (c.drr != null ? `${c.drr}%` : c.cpa ? rub(c.cpa) : '—')

/* ---------- графика ---------- */

/** Спарклайн: линия 2px с лёгкой заливкой, цвет берётся из currentColor. */
function spark(a, w = 96, h = 28) {
  const mx = Math.max(...a)
  const mn = Math.min(...a)
  const r = mx - mn || 1
  const pts = a.map((v, i) => [(i / (a.length - 1)) * w, h - 3 - ((v - mn) / r) * (h - 6)])
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')
  const last = pts[pts.length - 1]
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="currentColor" opacity=".1"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="currentColor"/></svg>`
}

/** Мини-столбики по дням (конверсии кампании). */
function bars(a, w = 56, h = 20) {
  const mx = Math.max(...a, 1)
  const bw = w / a.length
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${a
    .map((v, i) => {
      const bh = Math.max(2, (v / mx) * h)
      return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="currentColor" opacity="${v ? 0.85 : 0.25}"/>`
    })
    .join('')}</svg>`
}

/** График «цена заявки по дням» из ответа ИИ: одна серия, линия цели, подсказка при наведении. */
function cpaChart(w = 560, h = 170) {
  const { cpa, days, target } = M.chat
  const padL = 40
  const padB = 22
  const padT = 14
  const lo = 320
  const hi = 470
  const x = (i) => padL + (i / (cpa.length - 1)) * (w - padL - 12)
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB)
  const d = cpa.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')
  const grid = [350, 400, 450]
    .map((v) => `<line x1="${padL}" x2="${w - 12}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="ch-tick">${v}</text>`)
    .join('')
  const ticks = [0, 3, 7, 10, 13].map((i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle" class="ch-tick">${days[i]}</text>`).join('')
  const hits = cpa
    .map((v, i) => `<g class="ch-hit"><rect x="${x(i) - 18}" y="0" width="36" height="${h - padB}" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="4.5" class="ch-dot"/><title>${days[i]}: ${v} ₽</title></g>`)
    .join('')
  const wk = x(6.5)
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Цена заявки по дням, рубли">
    ${grid}
    <rect x="${wk}" y="${padT}" width="${w - 12 - wk}" height="${h - padT - padB}" class="ch-week"/>
    <line x1="${padL}" x2="${w - 12}" y1="${y(target)}" y2="${y(target)}" class="ch-target"/>
    <text x="${w - 14}" y="${y(target) - 6}" text-anchor="end" class="ch-label">цель ${target} ₽</text>
    <text x="${wk + 8}" y="${padT + 12}" class="ch-tick">прошлая неделя</text>
    <path d="${d}" class="ch-line"/>
    <circle cx="${x(13)}" cy="${y(cpa[13])}" r="4" class="ch-end"/>
    <text x="${x(13) - 8}" y="${y(cpa[13]) + 18}" text-anchor="end" class="ch-value">${cpa[13]} ₽</text>
    <text x="${x(0) + 6}" y="${y(cpa[0]) + 18}" class="ch-value">${cpa[0]} ₽</text>
    ${ticks}${hits}
  </svg>`
}

/** Выпадающий список. */
function dd(k, list, def, pre = '') {
  const cur = val(k, def)
  const menu = S.menu === `dd-${k}` ? `<div class="menu">${list.map((o) => `<button data-act="set:${k}=${attr(o)}">${o}${o === cur ? ic('check', 15) : ''}</button>`).join('')}</div>` : ''

/** Поле формы: значение переживает перерисовку экрана. */
function field(k, label, def, o = {}) {
  const input = o.area
    ? `<textarea data-k="${k}" rows="${o.rows || 3}" placeholder="${attr(o.ph || '')}">${esc(val(k, def))}</textarea>`
    : `<span class="inp"><input data-k="${k}" value="${attr(val(k, def))}" placeholder="${attr(o.ph || '')}"${o.w ? ` style="width:${o.w}px"` : ''}>${o.unit ? `<i>${o.unit}</i>` : ''}</span>`
  return `<label class="field ${o.cls || ''}"><span>${label}</span>${input}${o.hint ? `<small>${o.hint}</small>` : ''}</label>`
}

const dl = (rows) => `<dl class="dl">${rows.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`

  const rest = M.chats.filter((c) => !waiting.includes(c))
  const nav = [['home', 'home', 'Главная'], ['camps', 'megaphone', 'Кампании'], ['queries', 'filter', 'Запросы'], ['reports', 'chart', 'Отчёты']]

  const chatRow = (c, wait) => `<button class="srow ${S.screen === 'chat' && S.chat === c.id ? 'active' : ''}" data-act="chat:${c.id}">${wait ? '<i class="pin"></i>' : ''}<span class="t">${c.title}</span></button>`

/* ---------- действия ---------- */

const ACT = {
  go: (v) => {
    S.screen = v
    S.sel.clear()
    S.drawer = false
  },
  /* Раздел и вкладка в нём: «to:settings=ui». */
  to: (v) => {
    const [scr, tab] = v.split('=')
    ACT.go(scr)
    S.sub[scr] = tab
  },
  /* Проект и раздел: «at:okna=queries». */
  at: (v) => {
    const [p, scr] = v.split('=')
    S.project = p || null
    ACT.go(scr)
  },
  sub: (v) => {
    const [k, tab] = v.split('=')
    S.sub[k] = tab
  },
  set: (v) => {
    const i = v.indexOf('=')
    S.form[v.slice(0, i)] = v.slice(i + 1)
  },
  flag: (v) => (S.flags[v] = !S.flags[v]),
  expert: (v) => {
    S.expert = v === 'on' ? true : v === 'off' ? false : !S.expert
    S.toast = S.expert ? 'Экспертный режим включён: появились фильтры, массовые действия и «Автопилот»' : 'Экспертный режим выключен: остался только простой вид'
  },
  theme: (v) => {
    S.theme = v || (S.theme === 'dark' ? 'light' : 'dark')
    S.themeSet = true
  },
  project: (v) => {
    S.project = v || null
    S.drawer = false
    S.sel.clear()
    if (S.screen === 'camp' || S.screen === 'wizard') S.screen = 'camps'
  },
  /* Переход из карты функций: «jump:reports,okna,tab-pl,expert». */
  jump: (v) => {
    S.sel.clear()
    /* Ссылка без вкладки открывает первую вкладку раздела, а не ту, что была открыта раньше. */
    delete S.sub[parseState(v).screen]
    applyState(v)
  },
  menu: (v) => (S.menu = S.menu === v ? null : v),
  drawer: () => (S.drawer = !S.drawer),
  modal: (v) => (S.modal = v),
  close: () => (S.modal = null),
  toast: (v) => (S.toast = v),
  chat: (v) => {
    Object.assign(S, { chat: v, screen: 'chat', panel: true, tab: 'changes', drawer: false })
  },
  panel: () => (S.panel = !S.panel),
  tab: (v) => {
    S.tab = v
    S.panel = true
  },
  done: (v) => {
    S.decided[v] = 'done'
    S.toast = M.tasks.find((t) => t.id === v).group === 'ai' ? 'Выполнено. Вернуть как было можно в «Истории»' : 'Готово. Запись появилась в «Истории»'
  },
  reject: (v) => (S.decided[v] = 'rejected'),
  later: (v) => (S.decided[v] = 'later'),
  undo: (v) => delete S.decided[v],
  sel: (v) => (S.sel.has(+v) ? S.sel.delete(+v) : S.sel.add(+v)),
  minus: (v) => (S.minus.has(v) ? S.minus.delete(v) : S.minus.add(v)),
  verdict: (v) => {
    const [id, x] = v.split('=')
    S.verdicts[id] = S.verdicts[id] === x ? null : x
  },
  model: () => (S.model = (S.model + 1) % 3),
  /* Включить или остановить кампанию: остановленная запоминает, какой была. */
  toggle: (v) => {
    const c = M.campaigns.find((x) => x.id === +v)
    c.on = !c.on
    if (c.on) c.health = c.was || 'warn'
    else {
      c.was = c.health === 'off' ? 'warn' : c.health
      c.health = 'off'
    }
    S.toast = c.on ? `«${c.name}» запущена` : `«${c.name}» остановлена. Вернуть можно в «Истории»`
  },
}

/* ---------- запуск ---------- */

function parseState(str) {
  const out = {}
  for (const p of str.split(',').filter(Boolean)) {
    if (p === 'expert' || p === 'simple') out.expert = p === 'expert'
    else if (p === 'light' || p === 'dark') out.theme = p
    else if (M.projects.some((x) => x.id === p)) out.project = p
    else if (p.startsWith('tab-')) out.tabOf = p.slice(4)
    else if (p.startsWith('chat-')) out.chat = p.slice(5)
    else if (p.startsWith('camp-')) out.camp = +p.slice(5)
    else if (p.startsWith('stage-')) out.stage = +p.slice(6)
    else if (p.startsWith('modal-')) out.modal = p.slice(6)
    else if (TITLES[p]) out.screen = p
  }
  return out
}

/** Состояние из адреса или из ссылки «Показать». */
function applyState(str) {
  const { tabOf, ...h } = parseState(str)
  Object.assign(S, { project: null }, h)
  if (tabOf) S.sub[S.screen] = tabOf
  if (h.stage != null) S.stageDone = Math.max(S.stageDone, h.stage)
  if (h.theme) S.themeSet = true
}

/** Сумма не рвётся на переносе строки: пробелы внутри числа и перед знаком рубля становятся неразрывными. Только в тексте — атрибуты и пути графиков не трогаем. */
const glue = (html) => html.replace(/>[^<]+</g, (t) => t.replace(/(\d) (?=\d{3}(?!\d)|₽)/g, '$1\u00a0'))

function boot() {
  const app = document.getElementById('app')
  const bar = document.getElementById('bar')
  let lastKey = ''

  const load = () => applyState(decodeURIComponent(location.hash.slice(1)))

  function paint() {
    const key = [S.screen, S.sub[S.screen], S.chat, S.camp, S.project].join('/')
    const keep = {}
    app.querySelectorAll('[data-scroll]').forEach((el) => (keep[el.dataset.scroll] = el.scrollTop))
    if (key !== lastKey) delete keep.main
    lastKey = key
    app.innerHTML = `<div class="v v2" data-theme="${S.theme}" data-mode="${S.expert ? 'expert' : 'simple'}" data-screen="${S.screen}">${glue(render())}</div>`
    /* Карта функций помнит, где её оставили, когда ушли смотреть раздел. */
    if (keep.map != null) S.mapY = keep.map
    else keep.map = S.mapY
    app.querySelectorAll('[data-scroll]').forEach((el) => (el.scrollTop = keep[el.dataset.scroll] || 0))
    const inApp = S.screen !== 'map' && S.screen !== 'start'
    bar.innerHTML = `<strong>Макет «Диалог»</strong>
      <nav><button class="${inApp ? 'active' : ''}" data-act="go:${inApp ? S.screen : 'home'}">Кабинет</button><button class="${S.screen === 'map' ? 'active' : ''}" data-act="go:map">Карта функций</button><button class="${S.screen === 'start' ? 'active' : ''}" data-act="go:start">Первый вход</button></nav>
      <nav><em>Режим:</em><button class="${S.expert ? '' : 'active'}" data-act="expert:off">Обычный</button><button class="${S.expert ? 'active' : ''}" data-act="expert:on">Экспертный</button></nav>
      <span>Данные вымышленные · всё кликабельно · <a href="index.html">три первых варианта</a></span>`
    document.title = `${TITLES[S.screen] || 'Главная'} — макет AiMarketing «Диалог»`
    const tab = S.sub[S.screen]
    try {
      history.replaceState(null, '', `#${[S.screen, tab && `tab-${tab}`, S.screen === 'chat' && `chat-${S.chat}`, S.screen === 'camp' && `camp-${S.camp}`, S.expert && 'expert', S.themeSet && S.theme, S.project].filter(Boolean).join(',')}`)
    } catch (e) {
      /* в предпросмотре без адреса состояние просто не запоминается */
    }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]')
    if (!el) {
      if (S.menu) {
        S.menu = null
        paint()
      }
      return
    }
    const i = el.dataset.act.indexOf(':')
    const name = i < 0 ? el.dataset.act : el.dataset.act.slice(0, i)
    const arg = i < 0 ? '' : el.dataset.act.slice(i + 1)
    /* Клик внутри окна мимо кнопок ничего не делает; клик по затемнению закрывает окно. */
    if (name === 'noop' || (el.classList.contains('scrim') && e.target !== el)) return
    app.querySelectorAll('[data-k]').forEach((f) => (S.form[f.dataset.k] = f.value))
    if (name !== 'menu') S.menu = null
    S.toast = null
    if ('close' in el.dataset) S.modal = null
    const flagsBefore = { ...S.flags }
    S.revert = null
    if (ACT[name]) ACT[name](arg, el)
    noteHistory(name, arg, flagsBefore)
    if (el.dataset.then) ACT.go(el.dataset.then)
    paint()
  })
  /* Поле поиска фильтрует список сразу: перерисовываем и возвращаем курсор в поле. */
  document.addEventListener('input', (e) => {
    const f = e.target
    if (!f.dataset || !('live' in f.dataset)) return
    S.form[f.dataset.k] = f.value
    paint()
    const again = app.querySelector(`[data-k="${f.dataset.k}"]`)
    if (again) {
      again.focus()
      again.setSelectionRange(again.value.length, again.value.length)
    }
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (S.modal || S.menu || S.drawer)) Object.assign(S, { modal: null, menu: null, drawer: false })
    else if (!onKey(e)) return
    paint()
  })
  window.addEventListener('hashchange', () => {
    load()
    paint()
  })

  load()
  paint()
}

/* Отчёты и общие графики макета. Правила графиков: одна шкала на график, тонкие линии, подписи серым, подсказка при наведении. */

const mod = (a, n) => ((a % n) + n) % n
const sum = (a) => a.reduce((s, v) => s + v, 0)
const avg = (a) => sum(a) / (a.length || 1)
const tickText = (v) => (Number.isInteger(v) ? num(v) : String(v).replace('.', ','))
const pct = (v) => `${String(v).replace('.', ',')}%`

/** Ровные деления оси от нижней до верхней границы. */
function ticksFor(lo, hi, minStep = 0) {
  if (hi <= lo) hi = lo + 1
  const raw = (hi - lo) / 4
  const pow = 10 ** Math.floor(Math.log10(raw))
  const f = raw / pow
  const step = Math.max(minStep, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * pow)
  const out = []
  for (let v = Math.floor(lo / step) * step; v < Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(4))
  return out
}

/** Подписи дней под графиком: не чаще семи, отсчёт от последнего дня. */
function dayTicks(labels, x, y) {
  const step = Math.ceil(labels.length / 7)
  let out = ''
  for (let i = labels.length - 1; i >= 0; i -= step) out += `<text x="${x(i).toFixed(1)}" y="${y}" text-anchor="middle" class="ch-tick">${labels[i]}</text>`
  return out
}

/** Линейный график. Серия с prev — прошлый период, рисуется пунктиром. */
function lineChart({ series, labels, target, fmt = rub, w = 720, h = 200, label = '' }) {
  const n = labels.length
  const padL = 56
  const padR = 18
  const padT = 24
  const padB = 26
  const all = series.flatMap((s) => s.data).concat(target != null ? [target] : [])
  const T = ticksFor(Math.min(...all), Math.max(...all))
  const lo = T[0]
  const hi = T[T.length - 1]
  const x = (i) => padL + (i / Math.max(1, n - 1)) * (w - padL - padR)
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB)
  const path = (a) => a.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')
  const grid = T.map((v) => `<line x1="${padL}" x2="${w - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid"/><text x="${padL - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="ch-tick">${tickText(v)}</text>`).join('')
  const main = series.find((s) => !s.prev) || series[0]
  const last = main.data[n - 1]
  const up = n < 2 || last >= main.data[n - 2]
  /* Подпись последней точки не садится на линию цели: уходит по другую сторону точки. */
  const side = (v) => y(last) + (v ? -10 : 18)
  const endY = target != null && Math.abs(side(up) - 4 - y(target)) < 12 ? side(!up) : side(up)
  const slot = (w - padL - padR) / Math.max(1, n - 1)
  const hits = labels.map((d, i) => `<g class="ch-hit"><rect x="${(x(i) - slot / 2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${h - padB}" fill="transparent"/>${series.map((s) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.data[i]).toFixed(1)}" r="4.5" class="ch-dot ${s.prev ? 'ch-dot--prev' : ''}"/>`).join('')}<title>${d}: ${series.map((s) => `${series.length > 1 ? `${s.name} — ` : ''}${fmt(s.data[i])}`).join('; ')}</title></g>`).join('')
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i class="${s.prev ? 'prev' : ''}"></i>${s.name}</span>`).join('')}</div>` : ''
  return `${legend}<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${attr(label)}">
    ${grid}
    ${target != null ? `<line x1="${padL}" x2="${w - padR}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" class="ch-target"/><text x="${padL + 6}" y="${(y(target) - 6).toFixed(1)}" class="ch-label">цель ${fmt(target)}</text>` : ''}
    ${series.filter((s) => s.prev).map((s) => `<path d="${path(s.data)}" class="ch-line ch-line--prev"/>`).join('')}
    ${series.filter((s) => !s.prev).map((s) => `<path d="${path(s.data)}" class="ch-line"/>`).join('')}
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" class="ch-end"/>
    <text x="${(x(n - 1) + 6).toFixed(1)}" y="${endY.toFixed(1)}" text-anchor="end" class="ch-value">${fmt(last)}</text>
    ${dayTicks(labels, x, h - 6)}${hits}
  </svg>`
}

/** Столбики по дням: от нуля, скруглён только верх, между столбиками зазор. */
function barChart({ data, labels, fmt = num, w = 520, h = 190, label = '', none = 'За эти дни ничего не было' }) {
  const n = data.length
  const padL = 48
  const padR = 8
  const padT = 12
  const padB = 26
  const base = h - padB
  const T = ticksFor(0, Math.max(...data, 1), data.every(Number.isInteger) ? 1 : 0)
  const hi = T[T.length - 1]
  const y = (v) => padT + (1 - v / hi) * (base - padT)
  const slot = (w - padL - padR) / n
  const bw = Math.min(28, slot - Math.max(2, slot * 0.2))
  const x = (i) => padL + i * slot + slot / 2
  const grid = T.map((v) => `<line x1="${padL}" x2="${w - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid"/><text x="${padL - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="ch-tick">${tickText(v)}</text>`).join('')
  const marks = data.map((v, i) => {
    const l = x(i) - bw / 2
    const top = y(v)
    const r = Math.min(4, bw / 2, base - top)
    const d = v > 0 ? `<path d="M${l.toFixed(1)} ${base} V${(top + r).toFixed(1)} Q${l.toFixed(1)} ${top.toFixed(1)} ${(l + r).toFixed(1)} ${top.toFixed(1)} H${(l + bw - r).toFixed(1)} Q${(l + bw).toFixed(1)} ${top.toFixed(1)} ${(l + bw).toFixed(1)} ${(top + r).toFixed(1)} V${base} Z" class="ch-bar"/>` : ''
    return `<g class="ch-hit"><rect x="${(x(i) - slot / 2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${base}" fill="transparent"/>${d}<title>${labels[i]}: ${fmt(v)}</title></g>`
  }).join('')
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${attr(label)}">
    ${grid}${marks}${Math.max(...data) > 0 ? '' : `<text x="${(padL + (w - padL - padR) / 2).toFixed(1)}" y="${((padT + base) / 2).toFixed(1)}" text-anchor="middle" class="ch-label">${none}</text>`}
    ${dayTicks(labels, x, h - 6)}
  </svg>`
}

/** Горизонтальные полосы «кто сколько потратил». */
function hbars(rows) {
  const max = Math.max(...rows.map((r) => r.value), 1)
  return `<div class="hbars">${rows.map((r) => `<div class="hbar"><div class="hbar__l">${r.label}</div><span class="hbar__bar" aria-hidden="true"><i style="width:${Math.max(1, (r.value / max) * 100).toFixed(1)}%"></i></span><b class="num">${r.text}</b><small class="num">${r.note || ''}</small></div>`).join('')}</div>`
}

/** Ряды по дням под выбранный проект: расход, конверсии, цена заявки или ДРР, подписи дат. back — на сколько дней раньше. */
function daily(n, back = 0) {
  const p = S.project && project(S.project)
  const out = { spend: [], conv: [], kpi: [], labels: [] }
  for (let i = 0; i < n; i++) {
    const k = back + n - 1 - i
    const j = mod(13 - k, 14)
    const fade = k > 13 ? 0.97 - 0.012 * (k % 4) : 1
    out.spend.push(Math.round((M.spendDays[j] * (p ? p.week / M.totals.week : 1) * fade) / 10) * 10)
    out.conv.push(Math.max(0, Math.round(M.convDays[j] * (p ? p.conv / M.totals.conv : 1) * fade)))
    const rel = M.cpaDays[j] / M.totals.cpa
    out.kpi.push(isDrr(p) ? Math.round(rel * p.value * 10) / 10 : Math.round(rel * (p ? p.value : M.totals.cpa)))
    const d = new Date(2026, 10, 9 - k)
    out.labels.push(`${d.getDate()}.${d.getMonth() + 1}`)
  }
  return out
}

        return `<tr class="${on(`ad:${i}`) && !stopped ? 'is-change' : ''}"><td>${stopped ? '' : checkBtn(`flag:ad:${i}`, on(`ad:${i}`), 'Выбрать объявление')}</td><td>${stopped ? `<s>${a.t}</s>` : `<b>${a.t}</b>`}<small>${a.g}</small></td>
          <td class="r">${pct(a.s)}</td><td class="r">${pct(a.n)}</td><td class="r">${a.clicks}</td><td class="r">${a.conv || '—'}</td>
          <td>${stopped ? `<span class="st st--off">${ic('pause', 13)}Остановлено</span>` : a.weak ? badge('warn', 'Слабое') : badge('ok', 'Работает')}</td></tr>`
      }).join('')}</table></div>
    <p class="meta">В макете показаны объявления одной кампании. ${on('moder') ? 'Новые варианты сразу уйдут на модерацию.' : 'Новые варианты сохранятся черновиками — на модерацию отправляете вы.'}</p>`
}

function reports() {
  const p = S.project && project(S.project)
  const drr = isDrr(p)
  const per = val('rper', '7')
  const P = PERIODS[per]
  const D = daily(P.n)
  const R = reportTotals(P, D)
  const tab = sub('reports', 'dyn')
  const kfmt = drr ? pct : rub
  const camps = visibleCampaigns().filter((c) => !c.archived).sort((a, b) => b.cost - a.cost).slice(0, 6)
  const simple = `<div class="tiles">
      ${tile('Потрачено', rub(R.spend), `на ${Math.abs(P.d[0])}% ${P.d[0] > 0 ? 'больше' : 'меньше'}, чем ${P.word}`)}
      ${tile(drr ? 'Заказы' : 'Заявки', num(R.conv), `на ${Math.abs(P.d[1])}% ${P.d[1] > 0 ? 'больше' : 'меньше'}, чем ${P.word}`)}
      ${tile(drr ? 'Доля расходов на рекламу' : 'Цена заявки', kfmt(R.kpi), p ? `цель — до ${kfmt(p.target)}` : `на ${Math.abs(P.d[2])}% ${P.d[2] > 0 ? 'дороже' : 'дешевле'}, чем ${P.word}`)}
    </div>
    <div class="duo">
      <div class="card pad"><h3 class="cap">Расход по дням, ₽</h3>${barChart({ data: D.spend, labels: D.labels, fmt: rub, label: 'Расход по дням' })}</div>
      <div class="card pad"><h3 class="cap">${drr ? 'Доля расходов на рекламу по дням, %' : 'Цена заявки по дням, ₽'}</h3>${lineChart({ series: [{ name: drr ? 'ДРР' : 'Цена заявки', data: D.kpi }], labels: D.labels, target: p ? p.target : null, fmt: kfmt, w: 520, h: 190, label: drr ? 'Доля расходов на рекламу по дням' : 'Цена заявки по дням' })}</div>
    </div>
    <h2>На что ушли деньги<small>кампании по расходу</small></h2>
    <div class="card pad">${hbars(camps.map((c) => ({ label: campName(c), value: c.cost, text: rub(Math.round((c.cost * P.k) / 10) * 10), note: c.conv ? `${Math.round(c.conv * P.k)} ${convWord(Math.round(c.conv * P.k), project(c.project))} · ${campKpi(c)}` : 'заявок нет' })))}</div>
    <div class="acts"><button class="btn btn--pri" data-act="chat:${S.project ? 'c1' : 'c5'}">${ic('sparkles', 16)}Попросить ИИ разобрать период</button></div>
    ${expertHint('Сравнение с прошлым периодом, площадки, слабые объявления и разбивка по кабинетам')}`
  return `<div class="page" data-scroll="main"><div class="wide">
    <div class="head"><div><p class="eyebrow">${projectName(S.project)} · ${P.title}</p><h1>Отчёты</h1></div>
      <div class="head__acts">${segm('rper', Object.entries(PERIODS).map(([k, v]) => [k, v.name]), '7')}</div></div>
    ${pro() ? `${ptabs('reports', [['dyn', 'Динамика'], ['pl', 'Площадки'], ['ads', 'Объявления']], 'dyn')}${tab === 'pl' ? reportsPlacements() : tab === 'ads' ? reportsAds() : reportsDyn(P, D, R)}` : simple}
  </div></div>`
}

Object.assign(ACT, {
  plmark: () => {
    const thr = parseInt(String(val('plthr', '250')).replace(/\D/g, ''), 10) || 0
    M.placements.forEach((x, i) => (S.flags[`pl:${i}`] = !x.conv && x.cost >= thr && !on(`plb:${i}`)))
    const n = M.placements.filter((x, i) => on(`pl:${i}`)).length
    S.toast = n ? `Отмечено: ${n} ${plural(n, 'площадка', 'площадки', 'площадок')} без заявок с расходом от ${rub(thr)}` : 'Под это условие площадок нет'
  },
  plban: () => {
    let n = 0
    M.placements.forEach((x, i) => {
      if (!on(`pl:${i}`) || on(`plb:${i}`)) return
      S.flags[`plb:${i}`] = true
      S.flags[`pl:${i}`] = false
      n++
    })
    S.toast = `Исключено: ${n} ${plural(n, 'площадка', 'площадки', 'площадок')}. Вернуть можно в «Истории»`
  },
  admark: () => {
    M.adStats.forEach((a, i) => (S.flags[`ad:${i}`] = !!a.weak && !on(`ads:${i}`)))
    S.toast = 'Отмечены объявления, по которым кликают заметно реже соседей'
  },
  adstop: () => {
    let n = 0
    M.adStats.forEach((a, i) => {
      if (!on(`ad:${i}`) || on(`ads:${i}`)) return
      S.flags[`ads:${i}`] = true
      S.flags[`ad:${i}`] = false
      n++
    })
    S.toast = `Остановлено: ${n} ${plural(n, 'объявление', 'объявления', 'объявлений')}. Вернуть можно в «Истории»`
  },
})

/* Главная: вопрос ИИ, то, что ждёт решения, сигналы сервиса и короткие итоги. */

const TONE = { urgent: ['bad', 'Срочно'], today: ['warn', 'Стоит посмотреть'] }
const STARTER_CHAT = ['c1', 'c3', 'c4']
const WHO = { ai: ['sparkles', 'ИИ'], user: ['user', 'Вы'], rule: ['zap', 'Правило'] }
const isDrr = (p) => !!p && p.kpi !== 'CPA'
const convWord = (n, p) => (isDrr(p) ? plural(n, 'заказ', 'заказа', 'заказов') : plural(n, 'заявка', 'заявки', 'заявок'))
const versus = (d, up, down) => `на ${Math.abs(d)}% ${d > 0 ? up : down}, чем неделей раньше`
const topCamps = (n) => visibleCampaigns().filter((c) => !c.archived).sort((a, b) => b.cost - a.cost).slice(0, n)
const askChat = (t) => `chat:${TASK_CHAT[t.id] || 'c1'}`
const campName = (c) => `<button class="cname" data-act="camp:${c.id}" title="Открыть кампанию"><b>${c.name}</b></button>`
const histLine = (h) => `<div class="hline">${ic(WHO[h.who][0], 15)}<span><b>${h.title}</b><small>${h.day}, ${h.time} · ${WHO[h.who][1]}</small></span></div>`

/** Сигнал сервиса: находит код по цифрам, ИИ не тратится. */
function signal(t) {
  const st = S.decided[t.id]
  const p = t.project && project(t.project)
  if (st) return `<article class="sig is-closed"><p>${ic('check', 16)}<span><s>${t.title}</s> · ${st === 'later' ? 'скрыто до завтра' : 'готово'}</span></p><button class="btn btn--ghost btn--sm" data-act="undo:${t.id}">${ic('undo', 14)}Вернуть</button></article>`
  const [tone, label] = TONE[t.group]
  const act = t.go ? `at:${t.project || ''}=${t.go}` : t.ai ? askChat(t) : t.external ? 'toast:В рабочем кабинете здесь откроется оплата в Директе' : `done:${t.id}`
  return `<article class="sig">
    <div class="sig__top">${badge(tone, label)}<span>${p ? p.name : 'Все проекты'}</span></div>
    <h3>${t.title}</h3>${pro() ? '' : `<p>${t.text}</p>`}
    <div class="sig__acts"><button class="btn ${t.ai ? 'btn--pri' : ''}" data-act="${act}">${t.ai ? ic('sparkles', 15) : ''}${t.primary}${t.external ? ic('external', 14) : ''}</button>
      ${t.ai || t.external ? '' : `<button class="btn btn--ghost" data-act="${askChat(t)}" title="Спросить ИИ об этом">${ic('sparkles', 15)}Спросить</button>`}
      <button class="btn btn--ghost btn--icon" data-act="later:${t.id}" title="Скрыть до завтра" aria-label="Скрыть до завтра">${ic('x', 15)}</button></div>
  </article>`
}

/** Предложение ИИ, которое ждёт решения. */
function prow(t) {
  const st = S.decided[t.id]
  const p = project(t.project)
  if (st) return `<div class="prow is-closed"><div><small>${p.name}</small><b><s>${t.title}</s></b></div>
    <div class="prow__acts">${st === 'done' ? badge('ok', 'Выполнено') : rejected}<button class="btn btn--ghost btn--sm" data-act="undo:${t.id}">${ic('undo', 14)}Вернуть</button></div></div>`
  return `<div class="prow"><div><small>${p.name}</small><b>${t.title}</b><p>${t.text}</p>${pro() && t.diff ? diffTable(t) : ''}</div>
    <div class="prow__acts"><button class="btn btn--pri" data-act="done:${t.id}">Выполнить</button><button class="btn" data-act="reject:${t.id}">Отклонить</button><button class="btn btn--ghost" data-act="${askChat(t)}">Открыть чат</button></div></div>`
}

/** Итоги недели простыми словами. */
function weekTiles() {
  const T = totals()
  const p = S.project && project(S.project)
  return `<div class="tiles">
    ${tile('Потрачено', rub(T.week), versus(T.weekDelta, 'больше', 'меньше'))}
    ${tile(isDrr(p) ? 'Заказы' : 'Заявки', T.conv, versus(T.convDelta, 'больше', 'меньше'))}
    ${p ? tile(isDrr(p) ? 'Доля расходов на рекламу' : 'Цена заявки', isDrr(p) ? `${p.value}%` : rub(p.value), kpiVerdict(p)) : tile('Цена заявки', rub(T.cpa), versus(T.cpaDelta, 'дороже', 'дешевле'))}
    ${p ? tile('Деньги в Директе', rub(p.balance), `хватит примерно на ${p.balanceDays} ${plural(p.balanceDays, 'день', 'дня', 'дней')}`) : ''}
  </div>`
}

/** Четыре показателя со спарклайнами — экспертный вид. */
function kline() {
  const T = totals()
  const p = S.project && project(S.project)
  return `<div class="kline card num">
    <div><small>Сегодня</small><b>${rub(T.today)}</b><span>вчера ${rub(T.yesterday)}</span></div>
    <div><small>Расход за 7 дней</small><b>${rub(T.week)}</b><span>${delta(T.weekDelta)} к прошлой неделе</span>${spark(M.spendDays.slice(7), 48, 22)}</div>
    <div><small>Конверсии</small><b>${T.conv}</b><span>${delta(T.convDelta)} к прошлой неделе</span>${spark(M.convDays.slice(7), 48, 22)}</div>
    <div><small>${isDrr(p) ? 'ДРР' : 'CPA'}</small><b>${p ? (isDrr(p) ? `${p.value}%` : rub(p.value)) : rub(T.cpa)}</b><span>${p ? `цель ${isDrr(p) ? `${p.target}%` : rub(p.target)}` : `${delta(T.cpaDelta)} к прошлой неделе`}</span>${spark(M.cpaDays.slice(7), 48, 22)}</div>
  </div>`
}

/** Таблица проектов: темп бюджета, баланс и число сигналов. */
function projectsTable() {
  const list = M.projects.filter((p) => !on('onlybad') || p.status !== 'ok')
  const issues = (p) => M.tasks.filter((t) => t.project === p.id && !S.decided[t.id]).length
  return `<h2>Проекты <span>${list.length}</span><small><button class="chip chip--btn ${on('onlybad') ? 'is-on' : ''}" data-act="flag:onlybad">${on('onlybad') ? ic('check', 13) : ''}Только с проблемами</button></small></h2>
    <div class="card scroll-x"><table class="tbl num"><tr><th>Сайт</th><th>KPI за 7 дней</th><th class="r">Расход</th><th>Темп бюджета</th><th class="r">Баланс</th><th class="r">Сигналы</th></tr>
    ${list.map((p) => `<tr><td><button class="cname" data-act="project:${p.id}"><b>${p.name}</b></button><small>${p.client || 'Без клиента'}</small></td>
      <td>${kpiText(p)}<small>${badge(p.status)}</small></td><td class="r">${rub(p.week)}</td>
      <td><span class="meter" title="Прогноз расхода к концу месяца относительно бюджета"><i style="width:${Math.min(100, p.pace / 1.3).toFixed(0)}%"></i></span><small>${p.pace}% от плана</small></td>
      <td class="r">${rub(p.balance)}<small>на ${p.balanceDays} дн.</small></td><td class="r">${issues(p) || '—'}</td></tr>`).join('')}
    </table></div>`
}

/** Подробности проекта: неделя к неделе, бюджет месяца, баланс, кампании и действия. */
function projectBlocks(p) {
  const D = daily(14)
  const hist = M.history.filter((h) => h.project === p.id).slice(0, 3)
  return `<h2>Неделя к неделе<small>расход по дням, ₽</small></h2>
    <div class="card pad">${lineChart({ series: [{ name: 'Эта неделя', data: D.spend.slice(7) }, { name: 'Прошлая неделя', data: D.spend.slice(0, 7), prev: true }], labels: D.labels.slice(7), h: 190, label: 'Расход по дням: эта неделя и прошлая' })}</div>
    <div class="duo">
      <div class="card pad"><small class="cap">Бюджет месяца</small><b class="big num">${rub(p.month)} <span>из ${rub(p.budget)}</span></b>
        <span class="meter meter--wide"><i style="width:${Math.round((p.month / p.budget) * 100)}%"></i></span>
        <p class="muted">Темп ${p.pace}% от плана — к концу месяца выйдет около ${rub((p.budget * p.pace) / 100)}.</p></div>
      <div class="card pad"><small class="cap">Баланс кабинета Директа</small><b class="big num">${rub(p.balance)}</b>
        <p class="muted">Хватит примерно на ${p.balanceDays} ${plural(p.balanceDays, 'день', 'дня', 'дней')} при расходе около ${rub(p.week / 7)} в день.</p>
        <button class="btn btn--sm" data-act="toast:В рабочем кабинете здесь откроется оплата в Директе">Пополнить в Директе${ic('external', 14)}</button></div>
    </div>
    <h2>Топ кампаний<small><button class="lnk" data-act="go:camps">Все кампании</button></small></h2>
    <div class="card scroll-x"><table class="tbl num"><tr><th>Кампания</th><th>Состояние</th><th class="r">Расход</th><th class="r">Конверсии</th><th class="r">${isDrr(p) ? 'ДРР' : 'CPA'}</th></tr>
      ${topCamps(3).map((c) => `<tr><td>${campName(c)}<small>${c.type}</small></td><td>${badge(c.health)}</td><td class="r">${rub(c.cost)}</td><td class="r">${c.conv}</td><td class="r"><b>${campKpi(c)}</b></td></tr>`).join('')}</table></div>
    <h2>Последние действия<small><button class="lnk" data-act="go:history">Вся история</button></small></h2>
    <div class="card">${hist.length ? hist.map(histLine).join('') : '<p class="pad muted">За последние дни в проекте ничего не меняли.</p>'}</div>`
}

function home() {
  const tasks = visibleTasks()
  const props = tasks.filter((t) => t.group === 'ai')
  const allSigs = tasks.filter((t) => t.group !== 'ai')
  const sigs = pro() && val('sigf', 'all') === 'urgent' ? allSigs.filter((t) => t.group === 'urgent') : allSigs
  const p = S.project && project(S.project)
  const open = (list) => list.filter((t) => !S.decided[t.id]).length
  const simpleBottom = p
    ? `<h2>Кампании проекта<small><button class="lnk" data-act="go:camps">Все кампании</button></small></h2>
      <div class="card">${topCamps(3).map((c) => `<div class="crow crow--lite"><div>${campName(c)}<small>${c.type}</small></div><div class="crow__health">${campHealth(c)}</div><div class="crow__num num"><b>${rub(c.cost)}</b><small>${c.conv} ${convWord(c.conv, p)}</small></div>${badge(c.health)}</div>`).join('')}</div>`
    : `<h2>Проекты <span>${M.projects.length}</span></h2>
      <div class="pstrip">${M.projects.map((x) => `<button class="pc card" data-act="project:${x.id}"><b>${x.name}</b>${badge(x.status)}<p>${kpiVerdict(x)}</p></button>`).join('')}</div>`
  return `<div class="page" data-scroll="main"><div class="col">
    <p class="eyebrow">${M.date}</p>
    <h1>Что сделать с рекламой?</h1>
    ${composer(true, 'Спросите или поручите: «почему подорожали заявки?», «почисти запросы»…')}
    <div class="starters">${M.starters.map((s, i) => `<button data-act="chat:${STARTER_CHAT[i]}">${s}</button>`).join('')}</div>
    ${pro() ? kline() : ''}
    ${props.length ? `<h2>Ждут вашего решения <span>${open(props)}</span></h2><div class="card">${props.map(prow).join('')}</div>` : ''}
    <h2>Сервис заметил <span>${open(allSigs)}</span><small>по цифрам, без ИИ — лимит не тратится</small>${pro() ? segm('sigf', [['all', 'Все'], ['urgent', 'Срочные']], 'all') : ''}</h2>
    ${sigs.length ? `<div class="sigs">${sigs.map(signal).join('')}</div>` : `<div class="card pad muted">${allSigs.length ? 'Срочных сигналов нет.' : 'Сегодня всё спокойно: сервис не нашёл ничего, что требует внимания.'}</div>`}
    ${pro() ? '' : `<h2>За неделю<small><button class="lnk" data-act="go:reports">Все отчёты</button></small></h2>${weekTiles()}`}
    ${pro() ? (p ? projectBlocks(p) : projectsTable()) : simpleBottom}
  </div></div>`
}

/* Чат с ИИ: разговор слева, данные и предложения — в панели рядом. Сборка кампании идёт по шагам на доске. */

const STAGE_MSG = [

const hasCanvas = () => S.chat !== 'c5'
const aiMeta = (n) => (pro() ? `<p class="meta">Стандартная модель · обращений к данным: ${n} · около 1% месячного лимита</p>` : '')

function decision(id) {
  const st = S.decided[id]
  if (!st) return `<button class="btn btn--pri" data-act="done:${id}">${ic('check', 16)}Выполнить</button><button class="btn" data-act="reject:${id}">Отклонить</button>`
  return `${st === 'done' ? badge('ok', DONE_TEXT[id]) : rejected}<button class="btn btn--ghost btn--sm" data-act="undo:${id}">${ic('undo', 14)}${st === 'done' ? 'Вернуть как было' : 'Вернуть'}</button>`
}

const canvasShell = (head, body, foot) => `<aside class="canvas">
  <header class="canvas__head">${head}<button class="iconbtn" data-act="panel" aria-label="Закрыть панель">${ic('x')}</button></header>
  <div class="canvas__body" data-scroll="canvas">${body}</div>${foot ? `<footer class="canvas__foot">${foot}</footer>` : ''}</aside>`

const thread = (inner) => `<section class="thread">
  <div class="thread__scroll" data-scroll="main"><div class="thread__in">${inner}</div></div>
  <div class="thread__foot">${composer(false, 'Уточните или попросите что-то ещё…')}</div></section>`

/** Карточка предложения внутри ответа ИИ. */
const refCard = (t) => `<div class="ref card ${S.decided[t.id] ? 'is-closed' : ''}">
