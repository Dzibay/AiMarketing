# AiMarketing: Postgres → FastAPI → Nginx → Caddy → сайт.
#
# Сайт (Vue): /, /login, /register, /cabinet, /oauth/done, /admin-panel,
# /privacy, /consent, /offer, /cookies.
# Callback Яндекса: {PUBLIC_BASE_URL}/api/web/yandex/callback
#
# Запуск из корня репозитория:
#   copy .env.example .env
#   docker compose up -d --build

name: aimarketing

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aimarketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set in .env)}
      POSTGRES_DB: ${DB_NAME:-aimarketing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      RUN_EMBEDDED_WORKERS: "false"
    ports:
      # 8001 на хосте: часто 8000 уже занят другим локальным API
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      RUN_EMBEDDED_WORKERS: "true"
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (set in .env)}
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      nginx:
        condition: service_started
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
