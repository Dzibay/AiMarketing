server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # В одном корне: сайт «Толк» (site/, статичные index.html по папкам) и кабинет (frontend/, spa.html).
    root /usr/share/nginx/html;
    index index.html;
    # Редиректы с относительным Location: снаружи стоит Caddy с HTTPS, nginx не должен подставлять http://хост:80.
    absolute_redirect off;

    location /api/ {
        # Docker выдаёт контейнеру backend новый IP при пересоздании. Без резолвера
        # nginx запоминает адрес на старте и после этого ходит в чужой контейнер: 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Ассеты с хешем в имени: сайт — /_astro/, кабинет — /assets/.
    location ~ ^/(_astro|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Кабинет (Vue SPA): все его адреса отдают spa.html, дальше разбирается vue-router.
    location ~ ^/(cabinet|w|login|register|forgot-password|reset-password|verify-email|oauth|admin|admin-panel|privacy|consent|offer|cookies)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /spa.html =404;
    }

    location = /spa.html {
        add_header Cache-Control "no-cache";
    }

    # Сайт: /tarify/ → /tarify/index.html. Адрес без слэша и без расширения — 301 на адрес со слэшем
    # (trailingSlash: 'always' в Astro), чтобы у страницы был один адрес.
    location / {
        rewrite ^([^.?]*[^/])$ $1/ permanent;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
